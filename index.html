<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Навигатор квадрата Харада</title>
    <style>
        /* ===== ВЕСЬ CSS (полный, как в предыдущей версии) ===== */
        :root {
            --bg: #f9f7f3;
            --white: #ffffff;
            --card-shadow: 0 8px 24px rgba(0,0,0,0.06);
            --radius: 18px;
            --radius-sm: 10px;
            --blue: #4a7c96;
            --gold: #c4946c;
            --rose: #e8c4b8;
            --green: #7baa7b;
            --gray: #d4d0c8;
            --text: #3a3530;
            --text-light: #7a756f;
            --font: 'Segoe UI', -apple-system, Roboto, 'Helvetica Neue', sans-serif;
            --transition: 0.2s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #app {
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }
        .card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            padding: 24px 20px;
            margin-bottom: 20px;
            transition: var(--transition);
        }
        .card-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text);
        }
        .card-sub {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 28px;
            font-size: 16px;
            font-weight: 500;
            background: var(--blue);
            color: white;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            min-height: 48px;
            min-width: 48px;
            touch-action: manipulation;
            text-decoration: none;
            line-height: 1.2;
        }
        .btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn:active { transform: scale(0.97); }
        .btn-gold { background: var(--gold); }
        .btn-rose { background: var(--rose); color: var(--text); }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--blue);
            color: var(--blue);
        }
        .btn-outline:hover { background: var(--blue); color: white; }
        .btn-sm { padding: 8px 16px; font-size: 14px; min-height: 40px; }
        .btn-block { display: block; width: 100%; }
        .btn + .btn { margin-left: 10px; }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }
        .btn-group .btn { flex: 1 1 auto; }
        input, textarea, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8e4dc;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: var(--font);
            background: white;
            transition: var(--transition);
            color: var(--text);
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(74,124,150,0.15);
        }
        textarea { min-height: 80px; resize: vertical; }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .field-group { margin-bottom: 18px; }
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            margin: 12px 0;
        }
        .emoji-grid button {
            font-size: 32px;
            background: var(--bg);
            border: 3px solid transparent;
            border-radius: 12px;
            padding: 8px 0;
            cursor: pointer;
            transition: var(--transition);
            touch-action: manipulation;
        }
        .emoji-grid button:hover { background: #e8e4dc; }
        .emoji-grid button.selected {
            border-color: var(--blue);
            background: #e0edf5;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin: 12px 0;
        }
        .calendar-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            background: var(--gray);
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition);
            touch-action: manipulation;
            border: 2px solid transparent;
            position: relative;
        }
        .calendar-cell:hover { transform: scale(1.03); }
        .calendar-cell.today {
            border-color: var(--blue);
            background: #dce8f0;
            animation: pulse 2s infinite;
        }
        .calendar-cell.completed { background: var(--green); color: white; }
        .calendar-cell.partial { background: #f5e6b8; color: var(--text); }
        .calendar-cell.pause { background: #b5d9d9; color: white; }
        .calendar-cell.missed { background: #e8e4dc; color: var(--text-light); }
        .calendar-cell.future { background: #f5f3ef; color: #c0bbb3; cursor: default; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(74,124,150,0.4); }
            70% { box-shadow: 0 0 0 8px rgba(74,124,150,0); }
            100% { box-shadow: 0 0 0 0 rgba(74,124,150,0); }
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e8e4dc;
            border-radius: 12px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-bar .fill {
            height: 100%;
            background: var(--blue);
            border-radius: 12px;
            transition: width 0.4s ease;
        }
        .action-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #f0ede7;
        }
        .action-item:last-child { border-bottom: none; }
        .action-item .check {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 2px solid #c0bbb3;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: var(--transition);
            touch-action: manipulation;
        }
        .action-item .check.done {
            background: var(--green);
            border-color: var(--green);
            color: white;
        }
        .action-item .check.done::after {
            content: "✓";
            font-size: 18px;
            font-weight: 600;
        }
        .action-item .emoji-picker {
            font-size: 22px;
            cursor: pointer;
            flex-shrink: 0;
            min-width: 36px;
            text-align: center;
        }
        .action-item .text {
            flex: 1;
            font-size: 15px;
            line-height: 1.3;
        }
        .action-item .text .freq {
            font-size: 12px;
            color: var(--text-light);
            display: block;
        }
        .action-item .text.done-text {
            text-decoration: line-through;
            color: var(--text-light);
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .modal {
            background: white;
            border-radius: var(--radius);
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        .modal-overlay.open .modal { transform: scale(1); }
        .modal .close {
            float: right;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            padding: 0 4px;
        }
        .modal .close:hover { color: var(--text); }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--text);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 2000;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .info-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e8e4dc;
            font-size: 14px;
            color: var(--text-light);
        }
        .info-footer a {
            color: var(--blue);
            text-decoration: none;
            display: inline-block;
            margin-right: 16px;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .info-footer a:hover { text-decoration: underline; }
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .mt-8 { margin-top: 8px; }
        .mt-16 { margin-top: 16px; }
        .mt-24 { margin-top: 24px; }
        .flex-center { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .chip {
            display: inline-block;
            background: var(--bg);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            margin: 3px 4px 3px 0;
        }
        .direction-chip {
            background: #dce8f0;
            color: var(--blue);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            margin: 4px;
        }
        .accordion {
            border: 1px solid #e8e4dc;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            overflow: hidden;
        }
        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            background: var(--bg);
            transition: var(--transition);
            font-weight: 500;
            font-size: 15px;
        }
        .accordion-header:hover { background: #e8e4dc; }
        .accordion-header .badge {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-light);
            background: var(--white);
            padding: 2px 10px;
            border-radius: 20px;
        }
        .accordion-body {
            padding: 0 16px 12px;
            display: none;
        }
        .accordion-body.open { display: block; }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0;
        }
        .filter-bar .btn-sm { flex: 0 1 auto; }
        .flexible-indicator {
            font-size: 12px;
            color: var(--gold);
            margin-left: 6px;
        }
        .quadrant-label {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            background: #dce8f0;
            color: var(--blue);
            margin-left: 6px;
            display: inline-block;
        }
        .access-block {
            max-width: 400px;
            margin: 60px auto;
            text-align: center;
        }
        .access-block input {
            text-align: center;
            letter-spacing: 2px;
        }
        .week-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 8px;
        }
        .week-cell {
            background: var(--bg);
            border-radius: 8px;
            padding: 6px;
            min-height: 100px;
            font-size: 13px;
            border: 1px solid #e8e4dc;
        }
        .week-cell .day-label { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .week-cell .slot-label { font-size: 11px; color: var(--text-light); }
        .week-cell .task-item {
            background: white;
            border-radius: 4px;
            padding: 2px 6px;
            margin: 2px 0;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .week-cell .task-item .del { color: var(--text-light); cursor: pointer; }
        .matrix-quadrant { background: var(--bg); border-radius: 8px; padding: 10px; min-height: 80px; margin-bottom: 8px; }
        .matrix-task { background: white; border-radius: 4px; padding: 4px 8px; margin: 4px 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .matrix-task .actions { display: flex; gap: 6px; align-items: center; }
        .matrix-task .actions select { font-size: 12px; padding: 2px 6px; border-radius: 6px; border: 1px solid #ccc; }
        .matrix-task .actions button { background: none; border: none; cursor: pointer; font-size: 16px; }
        @media (max-width: 480px) {
            body { padding: 10px; }
            .card { padding: 18px 14px; }
            .emoji-grid { grid-template-columns: repeat(8, 1fr); gap: 4px; }
            .emoji-grid button { font-size: 26px; padding: 6px 0; }
            .calendar-cell { font-size: 12px; }
            .btn { font-size: 15px; padding: 10px 18px; }
            .week-grid { grid-template-columns: repeat(7, 1fr); gap: 4px; }
            .week-cell { min-height: 80px; }
        }
        @media (min-width: 641px) {
            #app { max-width: 720px; }
        }
    </style>
</head>
<body>
<div id="app">
    <div id="screen-container"></div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <button class="close" id="modalClose">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
</div>

<script>
    // ============================================================
    // 1. УПРАВЛЕНИЕ ДОСТУПОМ (продамус-совместимый)
    // ============================================================
    const ACCESS_KEY = 'navigator_access';
    function getAccess() {
        try {
            const raw = localStorage.getItem(ACCESS_KEY);
            if (!raw) return null;
            const data = JSON.parse(raw);
            if (data.expiry && new Date(data.expiry) < new Date()) {
                localStorage.removeItem(ACCESS_KEY);
                return null;
            }
            return data;
        } catch { return null; }
    }
    function setAccess(token, months) {
        const expiry = new Date();
        expiry.setMonth(expiry.getMonth() + months);
        const data = { token, expiry: expiry.toISOString() };
        localStorage.setItem(ACCESS_KEY, JSON.stringify(data));
    }
    function clearAccess() {
        localStorage.removeItem(ACCESS_KEY);
    }
    const VALID_TOKENS = {
        'demo': 1,
        'premium': 3,
        'annual': 12
    };
    function validateToken(token) {
        const months = VALID_TOKENS[token];
        if (months) {
            setAccess(token, months);
            return true;
        }
        return false;
    }

    // ============================================================
    // 2. ОСНОВНЫЕ ФУНКЦИИ + КОНСТАНТА PROMPT_TEXT
    // ============================================================
    const STORAGE_KEY = 'navigator_harada_v2';
    function loadData() {
        try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
    }
    function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    let state = loadData() || {
        putnik: { name: '', emoji: '🦊' },
        harada: null,
        selectedDirections: [],
        actionsChosen: [],
        actionDays: {},
        actionSlots: {},
        actionExactTime: {},
        customTasks: [],
        matrixTasks: [],
        weekPlan: {},
        months: [],
        currentMonth: 0,
        currentDay: 0,
        startDate: null,
        totalMonthsPlanned: 1,
        status: 'new',
        maxTasksPerDay: 5,
        showOnlyUrgentImportant: false,
        currentStep: 1,
        _taskIndex: 0,
    };

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove('show'), 2800);
    }
    function modalOpen(html) {
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('modalOverlay').classList.add('open');
    }
    function modalClose() {
        document.getElementById('modalOverlay').classList.remove('open');
    }
    document.getElementById('modalClose').addEventListener('click', modalClose);
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) modalClose();
    });

    // ===== ГЛОБАЛЬНАЯ КОНСТАНТА ПРОМПТА (ПОЛНЫЙ ТЕКСТ) =====
    const PROMPT_TEXT = `Ты коуч по методу Харада. Помоги мне собрать квадрат 9×9: в центре цель, вокруг 8 направлений, в каждом 8 регулярных действий.

Ограничения (читай первыми):
1. Ты интервьюер, а не консультант. Не предлагай продукты, форматы, стратегии, цены.
2. Не называй цифры, которые я не называл(а). Не придумывай чеков и расчётов.
3. Не подсказывай варианты ответов (без «например: ...»).
4. Всего не больше 15 вопросов. После ответов переходи к направлениям.
5. Не предлагай направления и выводы посреди интервью — только на шаге 2.
6. Не пересказывай мои ответы («фиксирую...», «итак...»). Получил ответ — задавай следующий вопрос.
7. Один короткий уточняющий вопрос на ответ, только если без него нельзя собрать квадрат.
8. Если я отвечаю «не знаю» — не отвечай за меня, просто переходи к следующему вопросу.
9. Задавай только по одному вопросу за раз. Не вываливай список.

Образ результата (держи в голове):
— Квадрат 9×9: цель по центру, 8 направлений вокруг, в каждом по 8 действий.
— Каждая ячейка — короткое (до 6 слов) регулярное действие с частотой или триггером, которое можно поставить в календарь.
— 2–3 направления — про опоры человека (энергия, тело, мышление, восстановление), а не только про дело.
— Все действия — личные, не делегируемые, реалистичные для моей недели (с учётом времени на контент, рабочих часов, семьи, быта).
— Финал — чек-лист на первый месяц по неделям, с фокусом на сопротивления и малые шаги.

Шаг 0. Вводная диагностика (задавать строго по одному вопросу, не списком)
Вопрос 1: Кто ты как эксперт? Ниша, аудитория, тип услуги?
Вопрос 2: Какое сейчас состояние: выгорание, усталость, норма, заряженность?
Вопрос 3: Сколько времени в день ты готова тратить на создание и публикацию контента (посты, рилсы, сторис)? (в часах)
Вопрос 4: Где хочешь больше проявляться: офлайн (встречи, мероприятия) или онлайн (соцсети, эфиры)?
Вопрос 5: Какие соцсети ведёшь сейчас и сколько подписчиков в каждой?
Вопрос 6: Сколько подписчиков хочешь иметь через год в каждой из этих соцсетей?
Вопрос 7: Какой доход хочешь через 12 месяцев? (сумма в месяц)
Вопрос 8: Сколько часов в день готова работать?
Вопрос 9: Есть ли что-то, что жёстко ограничивает твоё время? (дети, быт, здоровье)

Шаг 1. Интервью (после вводной диагностики, по одному вопросу за раз)
Блок 1. Цель
1. Какая у тебя цель на 12 месяцев? Одной фразой, как будто уже сбылась.
2. Если цель про доход — из каких конкретных источников он складывается?
3. Где ты сейчас относительно цели?

Блок 2. Действия
4. Что ты уже делаешь для достижения цели?
5. Что делают те, кто такой цели уже достиг?
6. Какие сферы надо качать, чтобы прийти к цели? Что в каждой из них тебе важно делать?

Блок 3. Сопротивления
7. Что из этого ты избегаешь делать? (задай только после ответа на вопрос 6)
8. Что надо делать для цели, но ты точно делать не будешь?
9. Что нужно изменить в твоей жизни, чтобы цель достигалась легко?

Блок 4. Жизнь и тело
10. Что в твоей жизни вне цели забирает или даёт время и силы?
11. Представь цель достигнутой. Как ты себя физически ощущаешь? Что нужно делать регулярно уже сейчас, чтобы прийти к этому ощущению?

Блок 5. Ограничения
12. Что тебя ещё сдерживает?

Блок 6. Ресурсы
13. Кто и что у тебя есть в помощь?

Если цель требует уточнений — дозадай 1–2 своих вопроса, не выходя за лимит 15.

Шаг 2. Направления
После интервью предложи 8 направлений. Правила:
— Направление — это сфера, а не задача и не инструмент.
— Направления не пересекаются.
— 2–3 направления — про опоры (энергия, тело, мышление, восстановление).
— Для эксперта в соцсетях обязательно включи: видимость/контент, упаковка, продажи, обучение, энергия/тело, восстановление, финансы, мышление.

        const dayLabels = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
        const slots = ['morning', 'afternoon', 'evening'];
        const slotLabels = { morning: 'Утро', afternoon: 'День', evening: 'Вечер' };

        const daysMap = {};
        dayKeys.forEach(key => {
            daysMap[key] = { morning: [], afternoon: [], evening: [] };
            const plan = state.weekPlan[key] || { morning: [], afternoon: [], evening: [] };
            Object.keys(plan).forEach(slot => {
                const ids = plan[slot] || [];
                ids.forEach(id => {
                    const found = allActions.find(a => a.actionId === id) || customSelected.find(t => t.id === id);
                    if (found) daysMap[key][slot].push(found);
                });
            });
        });

        const assigned = new Set();
        dayKeys.forEach(key => {
            const plan = state.weekPlan[key] || { morning: [], afternoon: [], evening: [] };
            Object.values(plan).forEach(arr => arr.forEach(id => assigned.add(id)));
        });
        const noDayTasks = [...allActions, ...customSelected].filter(t => !assigned.has(t.id || t.actionId));

        let weekHtml = `<div class="week-grid">`;
        dayKeys.forEach((key, idx) => {
            const slotsData = daysMap[key];
            weekHtml += `<div class="week-cell"><div class="day-label">${dayLabels[idx]}</div>`;
            slots.forEach(slot => {
                const tasks = slotsData[slot] || [];
                weekHtml += `<div class="slot-label">${slotLabels[slot]}:</div>`;
                if (tasks.length === 0) {
                    weekHtml += `<div style="font-size:11px; color:#bbb;">—</div>`;
                } else {
                    tasks.forEach(t => {
                        weekHtml += `<div class="task-item">${t.text} <span class="del" onclick="removeFromDay('${t.id || t.actionId}','${key}','${slot}')">✕</span></div>`;
                    });
                }
            });
            weekHtml += `</div>`;
        });
        weekHtml += `</div>`;

        let noDayHtml = '';
        if (noDayTasks.length > 0) {
            noDayHtml = `
                <div style="margin-top:16px; border-top:1px solid #d4d0c8; padding-top:12px;">
                    <div style="font-weight:600;">⚠️ Задачи без дня (${noDayTasks.length})</div>
                    <div style="font-size:13px; color:#7a756f;">Назначь день и время или отправь в приоритеты.</div>
                    ${noDayTasks.map(t => `
                        <div style="display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid #f0ede7; flex-wrap:wrap;">
                            <span style="min-width:80px;">${t.text}</span>
                            <select onchange="assignTask('${t.id || t.actionId}', this.value, document.getElementById('slot_${t.id || t.actionId}').value)">
                                <option value="">День</option>
                                ${dayKeys.map((dk, i) => `<option value="${dk}">${dayLabels[i]}</option>`).join('')}
                            </select>
                            <select id="slot_${t.id || t.actionId}">
                                <option value="morning">Утро</option>
                                <option value="afternoon">День</option>
                                <option value="evening">Вечер</option>
                            </select>
                            <button class="btn btn-sm btn-rose" onclick="sendToMatrix('${t.id || t.actionId}')">📊 В приоритеты</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        let html = `
            <div class="card">
                <h2>📅 Твоя неделя</h2>
                <div class="help-text" style="font-size:14px; color:#7a756f; background:#f5f3ef; padding:8px 12px; border-radius:8px; margin-bottom:12px;">Задачи распределены по дням и времени. Ты можешь редактировать.</div>
                ${weekHtml}
                ${noDayHtml}
                <div style="margin-top:16px;">
                    <button class="btn btn-gold" onclick="openMatrixModal()">❓ Приоритеты (важно/срочно)</button>
                </div>
                <button class="btn btn-block" style="margin-top:16px;" onclick="saveWeekPlan()">✅ Сохранить план на неделю</button>
            </div>
        `;
        return html;
    };

    // ----- ШАГ 4: КАЛЕНДАРЬ (из вчерашнего) -----
    screens.calendar = () => {
        const h = state.harada;
        if (!h) return '<div class="card">Нет данных</div>';
        const monthData = state.months[state.currentMonth] || { dailyData: {}, startDate: new Date().toISOString() };
        if (!state.months[state.currentMonth]) {
            state.months[state.currentMonth] = { dailyData: {}, startDate: new Date().toISOString() };
            saveData(state);
        }
        const start = new Date(monthData.startDate);
        const now = new Date();
        const diffDays = Math.floor((now - start) / (1000 * 60 * 60 * 24));
        const todayIndex = Math.min(diffDays + 1, 30);

        let html = `
            <div class="card">
                <div class="card-title">🗓️ Месяц ${state.currentMonth+1}</div>
                <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
                    <span style="font-size:14px; font-weight:500;">${h.goal}</span>
                </div>
                <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">
                    ${state.selectedDirections.map(idx => `<span class="direction-chip">${h.directions[idx]?.name || ''}</span>`).join('')}
                </div>
                <div class="progress-bar" style="margin-bottom:4px;">
                    <div class="fill" style="width:${calcMonthProgress()}%;"></div>
                </div>
                <div style="font-size:13px; color:var(--text-light); margin-bottom:12px;">
                    Выполнено ${calcMonthDone()} из ${calcMonthTotal()} действий
                    (День ${todayIndex} из 30)
                </div>
                <div class="filter-bar">
                    <button class="btn btn-sm btn-outline" onclick="toggleUrgentFilter()" id="urgentFilterBtn">
                        ${state.showOnlyUrgentImportant ? '🔒 Только важное и срочное' : '📋 Показать все'}
                    </button>
                    <button class="btn btn-sm btn-outline" onclick="expandAllAccordion()">📂 Развернуть всё</button>
                    <button class="btn btn-sm btn-outline" onclick="collapseAllAccordion()">📁 Свернуть всё</button>
                </div>
                <div class="calendar-grid" id="calendarGrid">
        `;
        for (let d = 1; d <= 30; d++) {
            const key = `day_${d}`;
            const dayData = monthData.dailyData[key] || { status: 'future' };
            let cls = 'future';
            if (d === todayIndex && dayData.status !== 'completed' && dayData.status !== 'pause') cls = 'today';
            else if (dayData.status === 'completed') cls = 'completed';
            else if (dayData.status === 'partial') cls = 'partial';
            else if (dayData.status === 'pause') cls = 'pause';
            else if (dayData.status === 'missed') cls = 'missed';
            else if (d < todayIndex) cls = 'missed';
            else if (d > todayIndex) cls = 'future';
            if (d === todayIndex && dayData.status === 'pause') cls = 'pause';
            html += `<div class="calendar-cell ${cls}" data-day="${d}" onclick="openDay(${d})">${d}</div>`;
        }
        html += `
                </div>
                <div class="btn-group" style="justify-content:center; margin-top:16px;">
                    <button class="btn" onclick="openDay(${todayIndex})">Прожить сегодня</button>
                    <button class="btn btn-gold" onclick="takePause()">Взять выходной</button>
                    <button class="btn btn-rose" onclick="state.currentStep=5; render();">Итоги месяца</button>
                </div>
            </div>
        `;
        html += renderFlexibleWidgets(monthData);
        return html;
    };

    function renderFlexibleWidgets(monthData) {
        const h = state.harada;
        if (!h) return '';
        const selectedDirs = state.selectedDirections.length ? state.selectedDirections : h.directions.map((_,i)=>i);
        let flexibleTasks = [];
        selectedDirs.forEach(idx => {
            const dir = h.directions[idx];
            dir.actions.forEach(a => {
                if (state.actionsChosen.length && !state.actionsChosen.includes(a.id || a.text)) return;
                if (a.flexible) {
                    flexibleTasks.push({ ...a, dirName: dir.name, dirIdx: idx });
                }
            });
        });
        if (flexibleTasks.length === 0) return '';

        const weekTasks = flexibleTasks.filter(a => a.periodType === 'week');
        const monthTasks = flexibleTasks.filter(a => a.periodType === 'month');

        let html = `<div class="card"><div class="card-title">📋 Гибкие задачи</div><div class="card-sub">Задачи, которые ты можешь выполнять в любое удобное время.</div>`;
        if (weekTasks.length) {
            html += `<div style="margin-bottom:8px;"><strong>Задачи недели</strong></div>`;
            html += renderFlexibleGroup(weekTasks, monthData, 'week');
        }
        if (monthTasks.length) {
            html += `<div style="margin-bottom:8px;"><strong>Задачи месяца</strong></div>`;
            html += renderFlexibleGroup(monthTasks, monthData, 'month');
        }
        html += `</div>`;
        return html;
    }

    function renderFlexibleGroup(tasks, monthData, period) {
        let html = `<div style="display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center;">`;
        tasks.forEach(a => {
            let doneCount = 0;
            const totalNeeded = a.periodCount || 1;
            for (let d = 1; d <= 30; d++) {
                const dayKey = `day_${d}`;
                const dayData = monthData.dailyData[dayKey];
                if (dayData && dayData.completedActions && dayData.completedActions.includes(a.id || a.text)) {
                    doneCount++;
                }
            }
            const done = doneCount >= totalNeeded;
            html += `
                <div style="display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid #f0ede7;">
                    <span style="font-size:14px;">${a.text}</span>
                    <span style="font-size:12px; color:var(--text-light);">${doneCount}/${totalNeeded}</span>
                    <span class="quadrant-label" style="font-size:10px;">${a.quadrant || ''}</span>
                </div>
                <div style="text-align:right;">
                    ${done ? '✅' : `<button class="btn btn-sm btn-gold" onclick="markFlexibleDone('${a.id || a.text}')">Выполнено</button>`}
                </div>
            `;
        });
        html += `</div>`;
        return html;
    }

    window.markFlexibleDone = function(actionId) {
        const now = new Date();
        const monthData = state.months[state.currentMonth] || { dailyData: {} };
        const start = new Date(monthData.startDate);
        const diffDays = Math.floor((now - start) / (1000 * 60 * 60 * 24));
        const dayIndex = Math.min(diffDays + 1, 30);
        const key = `day_${dayIndex}`;
        if (!monthData.dailyData[key]) monthData.dailyData[key] = { completedActions: [], missedActions: [], emotions: {}, reflection: {} };
        const dayData = monthData.dailyData[key];
        if (!dayData.completedActions) dayData.completedActions = [];
        if (!dayData.completedActions.includes(actionId)) {
            dayData.completedActions.push(actionId);
        }
        state.months[state.currentMonth] = monthData;
        saveData(state);
        toast('Гибкая задача отмечена как выполненная!');
        render();
    };

    // ----- ДНЕВНОЙ ПЛАН -----
    screens.day_plan = (data) => {
        const day = data?.day || 1;
        const h = state.harada;
        if (!h) return '<div class="card">Нет данных</div>';
        const key = `day_${day}`;
        const monthData = state.months[state.currentMonth] || { dailyData: {} };
        const dayData = monthData.dailyData[key] || { completedActions: [], missedActions: [], emotions: {}, reflection: {} };
        const selectedDirs = state.selectedDirections.length ? state.selectedDirections : h.directions.map((_,i)=>i);
        let allActions = [];
        const now = new Date();
        const start = new Date(monthData.startDate || now);
        const dayOfWeek = ((Math.floor((now - start) / (1000 * 60 * 60 * 24)) + 1) % 7) || 7;
        const dayOfMonth = day;
        selectedDirs.forEach(idx => {
            const dir = h.directions[idx];
            dir.actions.forEach(a => {
                if (state.actionsChosen.length && !state.actionsChosen.includes(a.id || a.text)) return;
                if (a.flexible) return;
                let shouldShow = false;
                if (a.freq === 'daily') shouldShow = true;
                else if (a.freq === 'weekly' && a.daysOfWeek) {
                    if (a.daysOfWeek.includes(dayOfWeek)) shouldShow = true;
                } else if (a.freq === 'monthly' && a.dayOfMonth) {
                    if (dayOfMonth === a.dayOfMonth) shouldShow = true;
                } else if (a.freq === 'quarterly') {
                    if (dayOfMonth === 1 && ((Math.floor((now - start) / (1000*60*60*24*30))) % 3 === 0)) shouldShow = true;
                }
                if (!a.freq) shouldShow = true;
                if (shouldShow) {
                    allActions.push({ ...a, dirIdx: idx, dirName: dir.name, actionId: a.id || uid() });
                }
            });
        });

        let filteredActions = allActions;
        if (state.showOnlyUrgentImportant) {
            filteredActions = filteredActions.filter(a => a.quadrant === 'urgent_important');
        }

        const maxTasks = state.maxTasksPerDay || 5;
        const priorityOrder = { 'urgent_important': 0, 'important_not_urgent': 1, 'urgent_not_important': 2, 'not_urgent_not_important': 3 };
        filteredActions.sort((a,b) => (priorityOrder[a.quadrant] || 0) - (priorityOrder[b.quadrant] || 0));
        const limitedActions = filteredActions.slice(0, maxTasks);
        const extraActions = filteredActions.slice(maxTasks);

        let html = `
            <div class="card">
                <div class="card-title">📌 День ${day}</div>
                <div style="font-size:14px; color:var(--text-light); margin-bottom:12px;">${h.goal}</div>
                <div class="filter-bar">
                    <button class="btn btn-sm btn-outline" onclick="toggleUrgentFilter()" id="urgentFilterBtnDay">
                        ${state.showOnlyUrgentImportant ? '🔒 Только важное и срочное' : '📋 Показать все'}
                    </button>
                    <button class="btn btn-sm btn-outline" onclick="expandAllAccordion()">📂 Развернуть всё</button>
                </div>
                <div id="dayActions">
        `;
        const grouped = {};
        limitedActions.forEach(a => {
            if (!grouped[a.dirName]) grouped[a.dirName] = [];
            grouped[a.dirName].push(a);
        });
        let dirNames = Object.keys(grouped);
        if (dirNames.length === 0) {
            html += `<div style="padding:12px; text-align:center; color:var(--text-light);">На сегодня нет задач. Отдыхай! 🎉</div>`;
        } else {
            dirNames.forEach((dirName, idx) => {
                const actions = grouped[dirName];
                const doneCount = actions.filter(a => dayData.completedActions && dayData.completedActions.includes(a.actionId)).length;
                const total = actions.length;
                const isOpen = (idx === 0);
                html += `
                    <div class="accordion">
                        <div class="accordion-header" onclick="toggleAccordion(this)">
                            <span>${dirName} <span class="badge">${doneCount}/${total} выполнено</span></span>
                            <span>${isOpen ? '▾' : '▸'}</span>
                        </div>
                        <div class="accordion-body ${isOpen ? 'open' : ''}">
                `;
                actions.forEach(a => {
                    const done = dayData.completedActions && dayData.completedActions.includes(a.actionId);
                    const emotion = dayData.emotions && dayData.emotions[a.actionId] || '';
                    const quadrantLabel = a.quadrant || '';
                    html += `
                        <div class="action-item">
                            <div class="check ${done ? 'done' : ''}" data-action="${a.actionId}" onclick="toggleAction('${a.actionId}')"></div>
                            <div class="emoji-picker" onclick="openEmojiPicker('${a.actionId}')">${emotion || '😶'}</div>
                            <div class="text ${done ? 'done-text' : ''}">
                                ${a.text}
                                <span class="freq">${a.freq || ''} · ${a.dirName} <span class="quadrant-label" style="font-size:10px;">${quadrantLabel}</span></span>
                            </div>
                        </div>
                    `;
                });
                html += `
                        </div>
                    </div>
                `;
            });
        }

        if (extraActions.length > 0) {
            html += `
                <div style="margin-top:12px;">
                    <details>
                        <summary style="cursor:pointer; color:var(--text-light); font-size:14px;">📌 Дополнительные задачи (${extraActions.length})</summary>
                        <div style="margin-top:8px; padding-left:8px; border-left:2px solid #e8e4dc;">
            `;
            extraActions.forEach(a => {
                const done = dayData.completedActions && dayData.completedActions.includes(a.actionId);
                html += `
                    <div style="display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid #f0ede7;">
                        <div class="check ${done ? 'done' : ''}" style="width:20px; height:20px;" data-action="${a.actionId}" onclick="toggleAction('${a.actionId}')"></div>
                        <span style="font-size:13px;">${a.text}</span>
                        <span class="quadrant-label" style="font-size:10px;">${a.quadrant || ''}</span>
                    </div>
                `;
            });
            html += `</div></details></div>`;
        }

        html += `
                </div>
                <div class="field-group" style="margin-top:12px;">
                    <label>Что я думаю о себе в этот момент? (если что-то не сделано)</label>
                    <textarea id="selfThought" rows="2" placeholder="Например: я ленивая...">${dayData.reflection?.thought || ''}</textarea>
                </div>
                <div class="btn-group" style="justify-content:center;">
                    <button class="btn" onclick="saveDay(${day})">Сохранить день</button>
                    <button class="btn btn-gold" onclick="shareDay(${day})">Поделиться с Катей</button>
                </div>
            </div>
        `;
        return html;
    };

            <span class="close" onclick="this.parentElement.parentElement.remove()">&times;</span>
            <h3>📖 Авторизация результата</h3>
            <div style="max-height:400px; overflow-y:auto; font-size:14px; line-height:1.7; color:var(--text);">
                <p><strong>Коучинговые техники, психологические техники, трансформационные книги не работают, когда энергия на нуле.</strong></p>
                <p>Мы не ставим цели уровня Илона Маска, если есть ощущение, что энергии недостаточно. Если энергии нет — мы ставим социально приемлемые цели, а не покорить Эверест ещё вчера. Мы учимся быть человеком, который идёт к цели бережно к себе.</p>
                <p>Когда мы выгораем или устали на первых двух стадиях, мы не чувствуем отсутствия энергии. Биохимия ещё не показывает изменения. Но выгоревший человек плохо реагирует на всё. Ему кажется, что мир катится в трубу. Ему важно выжить. Чаще всего ему кажется, что он умирает.</p>
                <p><strong>У нас есть техника — авторизация результата.</strong> Она делает всплеск нейромедиаторов и даёт возможность начать действие.</p>
                <p><strong>Что можно авторизовать?</strong> Всё, что угодно! Почистить зубы, помыть голову, приготовить яичницу, порезать помидоры, положить посуду в раковину. Это занимает 30–40 секунд.</p>
                <p><strong>Техника письменно (4 шага):</strong></p>
                <ol>
                    <li><strong>Стартовая ситуация</strong> — что я хотел(а) сделать?</li>
                    <li><strong>Процесс</strong> — что я сделал(а)? (активные глаголы, только «я»)</li>
                    <li><strong>Результат</strong> — что получилось? (без оценки, только факт)</li>
                    <li><strong>Зачем</strong> — какая моя потребность за этим стоит?</li>
                </ol>
                <p><strong>Пример:</strong> <em>«Я хотела приготовить омлет. Я взяла сковороду, разбила яйцо, добавила молоко, сделала омлет. Омлет готов. Я завтракаю. Я сделала это, чтобы быть здоровой и иметь силы на день.»</em></p>
                <p><strong>Если результат отрицательный:</strong> <em>«Мне нужно было смонтировать рилс — черновик не сохранился. Результат отрицательный. Не получилось, потому что я не сохранила черновик в процессе. В следующий раз сохраню черновик в процессе, чтобы не потерять изменения.»</em></p>
                <p>Авторизация отрицательного результата сбивает интенсивность негативных эмоций и останавливает мыслемешалку.</p>
                <p><strong>Почему это работает:</strong> Техника основана на работе гиппокампа — центра краткосрочной памяти. Когда мы авторизуем результат, мы завершаем гештальт. Эффект Зейгарник: когда задача не завершена, появляется мыслемешалка в голове. Авторизация успокаивает её.</p>
                <p><strong>Попробуй прямо сейчас:</strong> напиши авторизацию того, что ты только что сделала — прочитала эту статью.</p>
                <p style="font-style:italic; color:var(--text-light);">«Я открыла статью. Я прочитала текст. Я поняла технику. Я теперь умею делать это. Я сделала это, чтобы не терять энергию и идти к своей цели.»</p>
            </div>
        </div>
    `;

        });
        html += `</ul>`;
        return html;
    };

    // ----- ШАГ 1 -----
    window.addAction = function(idx) {
        const container = document.querySelector(`.act-text[data-idx="${idx}"]`);
        const freqSelect = document.querySelector(`.act-freq[data-idx="${idx}"]`);
        if (!container) return;
        const text = container.value.trim();
        const freq = freqSelect ? freqSelect.value : 'daily';
        if (!text) { toast('Введите текст действия'); return; }
        if (!state.harada) state.harada = { goal: '', directions: Array.from({length:8}, () => ({ name: '', actions: [] })) };
        if (!state.harada.directions[idx]) state.harada.directions[idx] = { name: '', actions: [] };
        state.harada.directions[idx].actions.push({ id: uid(), text, freq });
        saveData(state);
        container.value = '';
        if (freqSelect) freqSelect.value = 'daily';
        render(1);
        toast('Действие добавлено');
    };

    window.removeAction = function(idx, actIdx) {
        if (!state.harada) return;
        state.harada.directions[idx].actions.splice(actIdx, 1);
        saveData(state);
        render(1);
    };

    window.saveHarada = function() {
        const goal = document.getElementById('haradaGoal')?.value.trim();
        if (!goal) { toast('Введите цель'); return; }
        const dirNames = document.querySelectorAll('.dir-name');
        const h = { goal, directions: [] };
        let valid = true;
        dirNames.forEach((el, i) => {
            const name = el.value.trim() || `Направление ${i+1}`;
            const dir = state.harada?.directions?.[i] || { actions: [] };
            h.directions.push({ name, actions: dir.actions || [] });
        });
        h.directions.forEach((d, i) => {
            if (d.actions.length === 0) {
                toast(`В направлении "${d.name || i+1}" нет действий. Добавьте хотя бы одно.`);
                valid = false;
            }
        });
        if (!valid) return;
        state.harada = h;
        state.status = 'active';
        saveData(state);

        state.currentStep = 2;
        render(2);

    // ----- ШАГ 2 -----

    function initActionOptions() {}

    window.toggleDay = function(actionId, dayNum) {
        if (!state.actionDays[actionId]) state.actionDays[actionId] = [];
        const days = state.actionDays[actionId];
        const idx = days.indexOf(dayNum);
        if (idx > -1) days.splice(idx, 1);
        else days.push(dayNum);
        days.sort((a,b)=>a-b);
        saveData(state);
        const container = document.querySelector(`.day-selector[data-action-id="${actionId}"]`);
        if (container) {
            container.querySelectorAll('.day-btn').forEach(btn => {
                const day = parseInt(btn.dataset.day);
                btn.classList.toggle('selected', days.includes(day));
            });
        }

    window.prevTask = function() {
        if (state._taskIndex > 0) {
            state._taskIndex--;
            render(3);
        }
    };

    window.nextTask = function() {
        const cb = document.querySelector('.action-check-single');
        if (cb) {
            const id = cb.dataset.id;
            if (cb.checked && !state.actionsChosen.includes(id)) {
                state.actionsChosen.push(id);
            } else if (!cb.checked && state.actionsChosen.includes(id)) {
                state.actionsChosen = state.actionsChosen.filter(item => item !== id);
            }
            saveData(state);
        }
        const h = state.harada;
        if (!h) return;
        const selectedDirs = state.selectedDirections.length ? state.selectedDirections : h.directions.map((_,i)=>i);
        let allActions = [];
        selectedDirs.forEach(idx => {
            const dir = h.directions[idx];
            dir.actions.forEach(a => {
                if (a.freq === 'monthly' || a.freq === 'quarterly') return;
                allActions.push({ ...a, dirName: dir.name, actionId: a.id || uid() });
            });
        });
        if (state._taskIndex < allActions.length - 1) {
            state._taskIndex++;
            render(3);
        } else {
            toast('Все задачи просмотрены');
        }
    };

    window.addCustomTask = function() {
        const text = document.getElementById('customText')?.value.trim();
        if (!text) { toast('Введите название'); return; }
        const day = parseInt(document.getElementById('customDay')?.value) || null;
        const month = parseInt(document.getElementById('customMonth')?.value) || null;
        const timeSlot = document.getElementById('customTime')?.value || 'morning';
        const exactTime = document.getElementById('customExactTime')?.value || null;
        const repeat = document.getElementById('customRepeat')?.value || 'none';
        if (!state.customTasks) state.customTasks = [];
        state.customTasks.push({ id: uid(), text, date: day, month, timeSlot, exactTime, repeat, done: false });
        saveData(state);
        toast('Задача добавлена');
        render(3);
    };

    window.finishStep3 = function() {
        const cb = document.querySelector('.action-check-single');
        if (cb) {
            const id = cb.dataset.id;
            if (cb.checked && !state.actionsChosen.includes(id)) {
                state.actionsChosen.push(id);
            } else if (!cb.checked && state.actionsChosen.includes(id)) {
                state.actionsChosen = state.actionsChosen.filter(item => item !== id);
            }
            saveData(state);
        }
        toast(`Выбрано ${state.actionsChosen.length} задач`);
        initWeekPlan();
        state.currentStep = 3.5;
        render(3.5);
    };

    function initWeekPlan() {
        const days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
        const weekPlan = {};
        days.forEach(d => { weekPlan[d] = { morning: [], afternoon: [], evening: [] }; });

        const h = state.harada;
        if (!h) { state.weekPlan = weekPlan; saveData(state); return; }

        const selectedDirs = state.selectedDirections.length ? state.selectedDirections : h.directions.map((_,i)=>i);
        let allActions = [];
        selectedDirs.forEach(idx => {
            const dir = h.directions[idx];
            dir.actions.forEach(a => {
                if (state.actionsChosen.includes(a.id || a.text) && a.freq !== 'monthly' && a.freq !== 'quarterly') {
                    allActions.push({ ...a, actionId: a.id || a.text });
                }
            });
        });

        allActions.forEach(a => {
            if (a.freq === 'daily') {
                const slot = state.actionSlots[a.actionId] || 'morning';
                days.forEach(day => {
                    weekPlan[day][slot].push(a.actionId);
                });
            }
        });

        const dayMap = { 1:'monday',2:'tuesday',3:'wednesday',4:'thursday',5:'friday',6:'saturday',7:'sunday' };
        allActions.forEach(a => {
            if (a.freq === 'weekly' || (a.freq && a.freq.includes('нед'))) {
                const daysArr = state.actionDays[a.actionId] || [];
                daysArr.forEach(d => {
                    const key = dayMap[d];
                    if (key && weekPlan[key]) {
                        weekPlan[key].morning.push(a.actionId);
                    }
                });
            }
        });

        state.weekPlan = weekPlan;
        saveData(state);
    }

    // ----- ШАГ 3.5 -----
    window.assignTask = function(actionId, dayKey, slot) {
        if (!dayKey || !slot) return toast('Выберите день и время');
        if (!state.weekPlan) {
            const days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
            state.weekPlan = {};
            days.forEach(d => { state.weekPlan[d] = { morning: [], afternoon: [], evening: [] }; });
        }
        if (!state.weekPlan[dayKey]) state.weekPlan[dayKey] = { morning: [], afternoon: [], evening: [] };
        Object.keys(state.weekPlan).forEach(k => {
            Object.keys(state.weekPlan[k]).forEach(s => {
                state.weekPlan[k][s] = state.weekPlan[k][s].filter(id => id !== actionId);
            });
        });
        state.weekPlan[dayKey][slot].push(actionId);
        saveData(state);
        toast(`Задача добавлена в ${dayKey}, ${slot}`);
        render(3.5);
    };

    window.removeFromDay = function(actionId, dayKey, slot) {
        if (state.weekPlan && state.weekPlan[dayKey] && state.weekPlan[dayKey][slot]) {
            state.weekPlan[dayKey][slot] = state.weekPlan[dayKey][slot].filter(id => id !== actionId);
            saveData(state);
            render(3.5);
        }
    };

    window.sendToMatrix = function(actionId) {
        const h = state.harada;
        let task = null;
        if (h) {
            for (let dir of h.directions) {
                for (let a of dir.actions) {
                    if ((a.id || a.text) === actionId) {
                        task = { id: actionId, text: a.text, quadrant: 'plan' };
                        break;
                    }
                }
                if (task) break;
            }
        }
        if (!task) {
            const custom = state.customTasks?.find(t => t.id === actionId);
            if (custom) task = { id: actionId, text: custom.text, quadrant: 'plan' };
        }
        if (!task) { toast('Задача не найдена'); return; }
        if (!state.matrixTasks) state.matrixTasks = [];
        if (!state.matrixTasks.find(t => t.id === actionId)) state.matrixTasks.push(task);
        if (state.weekPlan) {
            Object.keys(state.weekPlan).forEach(k => {
                Object.keys(state.weekPlan[k]).forEach(s => {
                    state.weekPlan[k][s] = state.weekPlan[k][s].filter(id => id !== actionId);
                });
            });
        }
        saveData(state);
        toast('Задача отправлена в приоритеты');
        render(3.5);
    };

    window.openMatrixModal = function() {
        const tasks = state.matrixTasks || [];
        if (tasks.length === 0) { toast('В приоритетах пока нет задач'); return; }
        const quadrants = {
            now: { label: '🔥 Сделать сейчас', color: '#d4edda' },
            plan: { label: '📅 Запланировать', color: '#fff3cd' },
            minute: { label: '⚡ Задания на минуту', color: '#f8d7da' },
            joy: { label: '🎁 Для себя и радости', color: '#e2e3e5' }
        };
        const counts = { now: 0, plan: 0, minute: 0, joy: 0 };
        tasks.forEach(t => { if (counts.hasOwnProperty(t.quadrant)) counts[t.quadrant]++; });

        let html = `<div style="margin-bottom:12px; display:flex; gap:12px; flex-wrap:wrap;">`;
        Object.keys(quadrants).forEach(key => {
            html += `<span style="background:${quadrants[key].color}; padding:4px 12px; border-radius:20px; font-size:13px;">${quadrants[key].label}: ${counts[key]}</span>`;
        });
        html += `</div><div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">`;
        Object.keys(quadrants).forEach(key => {
            const q = quadrants[key];
            const items = tasks.filter(t => t.quadrant === key);
            html += `
                <div style="background:${q.color}; border-radius:8px; padding:10px; min-height:80px;">
                    <div style="font-weight:600; font-size:14px; margin-bottom:6px;">${q.label}</div>
                    ${items.map(t => `
                        <div class="matrix-task">
                            <span>${t.text}</span>
                            <div class="actions">
                                <select onchange="changeTaskQuadrant('${t.id}', this.value)" style="font-size:12px; padding:2px 6px; border-radius:6px;">
                                    <option value="now" ${t.quadrant==='now'?'selected':''}>Сейчас</option>
                                    <option value="plan" ${t.quadrant==='plan'?'selected':''}>Запланировать</option>
                                    <option value="minute" ${t.quadrant==='minute'?'selected':''}>На минуту</option>
                                    <option value="joy" ${t.quadrant==='joy'?'selected':''}>Для себя</option>
                                </select>
                                <button onclick="moveTaskFromMatrix('${t.id}')">↩️</button>
                                <button onclick="markMatrixDone('${t.id}')">✅</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        });
        html += `</div>`;
        modalOpen(`
            <div class="modal">
                <span class="close" onclick="this.parentElement.parentElement.remove()">&times;</span>
                <h3>📊 Приоритеты</h3>
                ${html}

    };

        const monthData = state.months[state.currentMonth] || { dailyData: {} };
        if (!monthData.dailyData[key]) monthData.dailyData[key] = { completedActions: [], missedActions: [], emotions: {}, reflection: {} };
        if (!monthData.dailyData[key].emotions) monthData.dailyData[key].emotions = {};
        monthData.dailyData[key].emotions[actionId] = emoji;
        state.months[state.currentMonth] = monthData;
        saveData(state);
        modalClose();
        render('day_plan', { day });
    };

    window.saveDay = function(day) {
        const key = `day_${day}`;
        const monthData = state.months[state.currentMonth] || { dailyData: {} };
        if (!monthData.dailyData[key]) monthData.dailyData[key] = { completedActions: [], missedActions: [], emotions: {}, reflection: {} };
        const dayData = monthData.dailyData[key];
        const thought = document.getElementById('selfThought')?.value || '';
        if (!dayData.reflection) dayData.reflection = {};
        dayData.reflection.thought = thought;
        const total = dayData.completedActions ? dayData.completedActions.length : 0;
        if (total > 0) {
            dayData.status = 'completed';
        } else {
            dayData.status = 'missed';
        }
        state.months[state.currentMonth] = monthData;
        saveData(state);
        toast('День сохранён!');
        if (total > 0) {
            setTimeout(() => {
                modalOpen(`
                    <h3 style="margin-bottom:12px;">🌟 Авторизация результата</h3>
                    <p style="font-size:14px; color:var(--text-light); margin-bottom:16px;">Ты отметил(а) ${total} действий как сделанные. Давай зафиксируем факт.</p>
                    <div class="field-group">
                        <label>Старт: я хотел(а) сделать</label>
                        <input id="authStart" value="${dayData.completedActions.map(id => {
                            const h = state.harada;
                            for (let d of h.directions) {
                                for (let a of d.actions) {
                                    if ((a.id || a.text) === id) return a.text;
                                }
                            }
                            return id;
                        }).join(', ')}" />
                    </div>
                    <div class="field-group">
                        <label>Процесс: я сделал(а)</label>
                        <input id="authProcess" value="то же, что и старт" />
                    </div>
                    <div class="field-group">
                        <label>Результат (факт, без оценки)</label>
                        <input id="authResult" placeholder="Что получилось?" />
                    </div>
                    <div class="field-group">
                        <label>Зачем? (моя потребность)</label>
                        <input id="authWhy" placeholder="Например: чтобы быть здоровой и иметь силы" />
                    </div>
                    <button class="btn btn-block" onclick="saveAuthorization()">Сохранить авторизацию</button>
                `);
            }, 400);
        } else {
            setTimeout(() => {
                modalOpen(`
                    <h3 style="margin-bottom:12px;">🪞 Что ты думаешь о себе в этот момент?</h3>
                    <div class="field-group">
                        <textarea id="selfReflect" rows="3" placeholder="Напиши, что приходит в голову..."></textarea>
                    </div>
                    <button class="btn btn-block" onclick="saveSelfReflect()">Сохранить</button>
                `);
            }, 400);
        }
        render(4);
    };

    window.saveAuthorization = function() {
        const start = document.getElementById('authStart')?.value || '';
        const process = document.getElementById('authProcess')?.value || '';
        const result = document.getElementById('authResult')?.value || '';
        const why = document.getElementById('authWhy')?.value || '';
        const day = window._currentDay || 1;
        const key = `day_${day}`;
        const monthData = state.months[state.currentMonth] || { dailyData: {} };
        if (!monthData.dailyData[key]) monthData.dailyData[key] = { completedActions: [], missedActions: [], emotions: {}, reflection: {} };
        monthData.dailyData[key].authorization = { start, process, result, why };
        state.months[state.currentMonth] = monthData;
        saveData(state);
        modalClose();
        toast('Авторизация сохранена! Серотонин пошёл 🌟');
    };

    window.saveSelfReflect = function() {
        const text = document.getElementById('selfReflect')?.value || '';
        const day = window._currentDay || 1;
        const key = `day_${day}`;
        const monthData = state.months[state.currentMonth] || { dailyData: {} };
        if (!monthData.dailyData[key]) monthData.dailyData[key] = { completedActions: [], missedActions: [], emotions: {}, reflection: {} };
        monthData.dailyData[key].selfReflection = text;
        state.months[state.currentMonth] = monthData;
        saveData(state);
        modalClose();
        toast('Ты справляешься. Если хочешь разобраться подробнее, я рядом.');
    };

    window.shareDay = function(day) {
        const text = `Привет, Катя! Сегодня я прожил(а) день ${day} в Навигаторе. Вот что получилось.`;
        window.open(`https://t.me/katerinasevastsyanova?text=${encodeURIComponent(text)}`, '_blank');
        toast('Отправлено Кате 🤍');
    };

    window.takePause = function() {
        const monthData = state.months[state.currentMonth] || { dailyData: {}, startDate: new Date().toISOString() };
        const start = new Date(monthData.startDate);
        const now = new Date();
        const diffDays = Math.floor((now - start) / (1000 * 60 * 60 * 24));
        const todayIndex = Math.min(diffDays + 1, 30);
        const key = `day_${todayIndex}`;
        if (!monthData.dailyData[key]) monthData.dailyData[key] = { completedActions: [], missedActions: [], emotions: {}, reflection: {} };
        monthData.dailyData[key].status = 'pause';
        state.months[state.currentMonth] = monthData;
        saveData(state);
        toast('Взят выходной 🛌 Отдыхай!');
        render(4);
    };

    // ----- ИТОГИ -----
    window.saveMonthResults = function() {
        const monthData = state.months[state.currentMonth] || { dailyData: {} };
        monthData.facts = {
            income: document.getElementById('factIncome')?.value || '',
            posts: document.getElementById('factPosts')?.value || '',
            subscribers: document.getElementById('factSubs')?.value || '',
            clients: document.getElementById('factClients')?.value || '',
            other: document.getElementById('factOther')?.value || ''
        };
        monthData.kolb = {
            experience: document.getElementById('kolbExperience')?.value || '',
            analysis: document.getElementById('kolbAnalysis')?.value || '',
            adjustment: document.getElementById('kolbAdjust')?.value || '',
            newAction: document.getElementById('kolbNew')?.value || ''
        };
        state.months[state.currentMonth] = monthData;
        saveData(state);
        toast('Итоги сохранены!');
    };

    // ----- ФИЛЬТРЫ -----
    function applyFiltersAndAccordion() {}
    function toggleAccordion(header) {
        const body = header.nextElementSibling;
        if (body) {
            body.classList.toggle('open');
            const icon = header.querySelector('span:last-child');
            if (icon) icon.textContent = body.classList.contains('open') ? '▾' : '▸';
        }
    }
    function expandAllAccordion() {
        document.querySelectorAll('.accordion-body').forEach(el => el.classList.add('open'));
        document.querySelectorAll('.accordion-header span:last-child').forEach(el => el.textContent = '▾');
    }
    function collapseAllAccordion() {
        document.querySelectorAll('.accordion-body').forEach(el => el.classList.remove('open'));
        document.querySelectorAll('.accordion-header span:last-child').forEach(el => el.textContent = '▸');
    }

    window.toggleUrgentFilter = function() {
        state.showOnlyUrgentImportant = !state.showOnlyUrgentImportant;
        saveData(state);
        if (state.currentStep === 4) render(4);
        else render(4);
        toast(state.showOnlyUrgentImportant ? 'Показаны только важные и срочные задачи' : 'Показаны все задачи');
    };

    // ----- РАСЧЁТЫ -----
    function calcMonthProgress() {
        const total = calcMonthTotal();
        if (!total) return 0;
        return Math.round((calcMonthDone() / total) * 100);
    }
    function calcMonthTotal() {
        const h = state.harada;
        if (!h) return 0;
        const selectedDirs = state.selectedDirections.length ? state.selectedDirections : h.directions.map((_,i)=>i);
        let count = 0;
        selectedDirs.forEach(idx => {
            const dir = h.directions[idx];
            dir.actions.forEach(a => {
                if (state.actionsChosen.length && !state.actionsChosen.includes(a.id || a.text)) return;
                count++;
            });
        });
        return count;
    }
    function calcMonthDone() {
        const monthData = state.months[state.currentMonth] || { dailyData: {} };
        let done = 0;
        Object.values(monthData.dailyData).forEach(d => {
            if (d.completedActions) done += d.completedActions.length;
        });
        return done;
    }

    // ----- ВСТАВКА ИЗ ИИ -----
    window.openAIPaste = function() {
        modalOpen(`
            <div class="modal">
                <span class="close" onclick="this.parentElement.parentElement.remove()">&times;</span>
                <h3>🤖 Вставь ответ ИИ</h3>
                <p style="font-size:14px; color:var(--text-light); margin-bottom:12px;">Скопируй ответ, который дал тебе ИИ после прохождения интервью по промпту. Я попытаюсь распарсить его и заполнить поля.</p>
                <div class="field-group">
                    <textarea id="aiResponse" rows="8" placeholder="Вставь сюда текст ответа ИИ..."></textarea>
                </div>
                <button class="btn btn-block" onclick="parseAIResponse()">Распарсить и заполнить</button>
            </div>
        `);
    };

    window.parseAIResponse = function() {
        const text = document.getElementById('aiResponse')?.value || '';
        if (!text.trim()) { toast('Вставь текст'); return; }
        let goal = '';
        const goalMatch = text.match(/(?:Цель|Моя цель|В центре цель)[:\s]*(.+?)(?:\n|$)/i);
        if (goalMatch) goal = goalMatch[1].trim();

        const dirs = [];
        const dirRegex = /(?:^|\n)\s*(\d+)\.\s*([^\n]+)/g;
        let match;
        while ((match = dirRegex.exec(text)) !== null) {
            const num = parseInt(match[1]);
            const name = match[2].trim();
            const start = match.index + match[0].length;
            let end = text.indexOf(`\n${num+1}.`, start);
            if (end === -1) end = text.length;
            const block = text.substring(start, end).trim();
            const actions = [];
            const actionLines = block.split('\n').filter(l => l.trim().length > 0);
            actionLines.forEach(line => {
                let freq = 'daily';
                if (line.match(/раз в неделю|еженедельно/i)) freq = 'weekly';
                else if (line.match(/раз в месяц|ежемесячно/i)) freq = 'monthly';
                else if (line.match(/раз в 3 месяца|квартал/i)) freq = 'quarterly';
                let clean = line.replace(/^[\s\-•\d.]+/, '').trim();
                if (clean.length > 3) {
                    actions.push({ id: uid(), text: clean, freq });
                }
            });
            dirs.push({ name, actions });
        }

        if (!goal) {
            const firstLine = text.split('\n').find(l => l.trim().length > 10);
            if (firstLine) goal = firstLine.trim();
        }

        document.getElementById('haradaGoal').value = goal;
        const dirInputs = document.querySelectorAll('.dir-name');
        dirInputs.forEach((input, i) => {
            if (i < dirs.length) {
                input.value = dirs[i].name;
                if (!state.harada) state.harada = { goal, directions: [] };
                if (!state.harada.directions[i]) state.harada.directions[i] = { name: dirs[i].name, actions: [] };
                state.harada.directions[i].actions = dirs[i].actions;
                state.harada.directions[i].name = dirs[i].name;
            } else {
                input.value = '';
            }
        });
        if (!state.harada) state.harada = { goal, directions: [] };
        while (state.harada.directions.length < 8) {
            state.harada.directions.push({ name: '', actions: [] });
        }
        dirs.forEach((d, i) => {
            if (i < state.harada.directions.length) {
                state.harada.directions[i].name = d.name;
                state.harada.directions[i].actions = d.actions;
            }
        });
        state.harada.goal = goal;
        saveData(state);
        modalClose();
        render(1);
        toast('Данные из ИИ вставлены! Проверь и сохрани.');
    };

    window.copyPrompt = function() {
        const text = PROMPT_TEXT;
        navigator.clipboard.writeText(text).then(() => {
            toast('Промпт скопирован!');
            modalClose();
        }).catch(() => {
            toast('Не удалось скопировать');
        });
    };

    // ============================================================
    // 5. ЗАПУСК
    // ============================================================
    const access = getAccess();
    if (!access) {
        renderAccessScreen();
    } else {
        const saved = loadData();
        if (saved && saved.harada && saved.status === 'active') {
            state = saved;
            if (state.currentStep === undefined) state.currentStep = 4;
            render(state.currentStep);
        } else if (saved && saved.harada && saved.status === 'paused') {
            state = saved;
            state.currentStep = 4;
            render(4);
        } else {
            state.currentStep = 1;
            render(1);
        }
    }
</script>
</body>
</html>
