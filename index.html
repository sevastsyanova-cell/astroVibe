<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тест: полный продукт (шаги 1–3.5)</title>
    <style>
        body { font-family: sans-serif; padding: 16px; background: #f9f7f3; max-width: 600px; margin: 0 auto; }
        .card { background: white; border-radius: 18px; padding: 24px; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
        .btn { background: #4a7c96; color: white; border: none; padding: 12px 24px; border-radius: 28px; font-size: 16px; cursor: pointer; display: inline-block; }
        .btn-gold { background: #c4946c; }
        .btn-rose { background: #e8c4b8; color: #3a3530; }
        .btn-sm { padding: 8px 16px; font-size: 14px; }
        .btn-block { display: block; width: 100%; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        input, select { width: 100%; padding: 14px; margin: 8px 0; border: 2px solid #e8e4dc; border-radius: 10px; box-sizing: border-box; }
        .chip { display: inline-block; background: #f0ede7; padding: 4px 12px; border-radius: 20px; margin: 4px; }
        .flex { display: flex; gap: 8px; }
        .flex > * { flex: 1; }
        .grid { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
        .day-selector { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
        .day-btn {
            padding: 8px 12px; border-radius: 30px; border: 2px solid #d4d0c8;
            background: white; cursor: pointer; font-weight: 500; font-size: 14px;
            min-width: 44px; text-align: center;
        }
        .day-btn.selected { background: #4a7c96; color: white; border-color: #4a7c96; }
        .modal-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal { background: white; padding: 24px; border-radius: 18px; max-width: 90%; max-height: 80%; overflow-y: auto; }
        .modal textarea { width: 100%; min-height: 100px; }
        .close { float: right; font-size: 24px; cursor: pointer; }
        .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
        .week-cell {
            background: #f0ede7; border-radius: 8px; padding: 6px; min-height: 120px;
            font-size: 13px; border: 1px solid #d4d0c8;
        }
        .week-cell .day-label { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .slot-label { font-size: 11px; color: #7a756f; margin-top: 2px; }
        .task-item { background: white; border-radius: 4px; padding: 2px 6px; margin: 2px 0; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
        .task-item .del { color: #7a756f; cursor: pointer; }
        .matrix-task { background: white; border-radius: 4px; padding: 4px 8px; margin: 4px 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .matrix-task .actions { display: flex; gap: 6px; }
        .matrix-task .actions button { background: none; border: none; cursor: pointer; font-size: 16px; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 30px; z-index: 999; display: none; }
        .toast.show { display: block; }
    </style>
</head>
<body>
<div id="app"><div id="screen"></div></div>
<div id="toast" class="toast"></div>

<script>
    // ===== ХРАНИЛИЩЕ =====
    const STORAGE_KEY = 'harada_test_v10';
    function load() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; } }
    function save(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

    let state = load() || {
        harada: null,
        selectedDirections: [],
        actionsChosen: [],
        actionDays: {},
        actionSlots: {},
        customTasks: [],
        matrixTasks: [],
        weekPlan: {},
        currentStep: 1,
        _taskIndex: 0,
    };

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove('show'), 3000);
    }

    function render() {
        const screen = document.getElementById('screen');
        if (state.currentStep === 1) renderStep1(screen);
        else if (state.currentStep === 2) renderStep2(screen);
        else if (state.currentStep === 3) renderStep3(screen);
        else if (state.currentStep === 3.5) renderStep35(screen);
        else screen.innerHTML = '<div class="card"><h2>Готово!</h2></div>';
    }

    // ============================================================
    // ШАГ 1
    // ============================================================
    function renderStep1(container) {
        const h = state.harada || { goal: '', directions: Array.from({length:8}, () => ({ name: '', actions: [] })) };
        let html = `
            <div class="card">
                <h2>🎯 Шаг 1. Квадрат Харада</h2>
                <div style="display:flex; gap:8px; margin-bottom:16px;">
                    <button class="btn btn-sm" onclick="openPromptModal()">📄 Промпт для ИИ</button>
                    <button class="btn btn-sm btn-gold" onclick="openAIPaste()">🤖 Вставить из ИИ</button>
                </div>
                <input id="goal" placeholder="Цель" value="${h.goal}" />
                <div><strong>8 направлений</strong></div>
        `;
        h.directions.forEach((dir, i) => {
            html += `
                <div style="margin-top:16px;">
                    <label>Направление ${i+1}</label>
                    <input class="dir-name" data-idx="${i}" value="${dir.name}" placeholder="Название" />
                    <div>
                        ${dir.actions.map((a, ai) => `<span class="chip">${a.text} (${a.freq}) <span onclick="removeAction(${i},${ai})" style="cursor:pointer;">✕</span></span>`).join('')}
                    </div>
                    <div class="flex">
                        <input class="act-text" data-idx="${i}" placeholder="Действие" />
                        <select class="act-freq" data-idx="${i}">
                            <option value="daily">ежедневно</option>
                            <option value="weekly">раз в неделю</option>
                            <option value="monthly">раз в месяц</option>
                            <option value="quarterly">раз в 3 мес</option>
                        </select>
                        <button class="btn" onclick="addAction(${i})">+</button>
                    </div>
                </div>
            `;
        });
        html += `<button class="btn btn-block btn-gold" onclick="saveHarada()">Сохранить квадрат →</button>`;
        html += `</div>`;
        container.innerHTML = html;
        document.getElementById('goal').value = h.goal;
    }

    window.addAction = function(idx) {
        const text = document.querySelector(`.act-text[data-idx="${idx}"]`).value.trim();
        const freq = document.querySelector(`.act-freq[data-idx="${idx}"]`).value;
        if (!text) return toast('Введите текст');
        if (!state.harada) state.harada = { goal: '', directions: Array.from({length:8}, () => ({ name: '', actions: [] })) };
        state.harada.directions[idx].actions.push({ id: uid(), text, freq });
        save(state);
        render();
    };
    window.removeAction = function(idx, actIdx) {
        if (!state.harada) return;
        state.harada.directions[idx].actions.splice(actIdx, 1);
        save(state);
        render();
    };
    window.saveHarada = function() {
        const goal = document.getElementById('goal').value.trim();
        if (!goal) return toast('Введите цель');
        const dirInputs = document.querySelectorAll('.dir-name');
        const h = { goal, directions: [] };
        let valid = true;
        dirInputs.forEach((el, i) => {
            const name = el.value.trim() || `Направление ${i+1}`;
            const dir = state.harada?.directions?.[i] || { actions: [] };
            h.directions.push({ name, actions: dir.actions || [] });
        });
        h.directions.forEach((d, i) => {
            if (d.actions.length === 0) {
                toast(`В направлении "${d.name || i+1}" нет действий. Добавьте хотя бы одно.`);
                valid = false;
            }
        });
        if (!valid) return;
        state.harada = h;
        save(state);
        toast('Квадрат сохранён!');
        state.currentStep = 2;
        render();
    };

    // ===== ИИ =====
    const PROMPT_TEXT = `Ты коуч по методу Харада... (полный промпт)`;
    window.openPromptModal = function() {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal">
                <span class="close" onclick="this.parentElement.parentElement.remove()">&times;</span>
                <h3>📄 Промпт для ИИ</h3>
                <pre style="white-space:pre-wrap; background:#f0ede7; padding:12px; border-radius:10px; max-height:300px; overflow:auto;">${PROMPT_TEXT}</pre>
                <button class="btn btn-block" onclick="navigator.clipboard.writeText(PROMPT_TEXT).then(()=>toast('Скопировано!'))">📋 Скопировать</button>
            </div>
        `;
        document.body.appendChild(modal);
    };
    window.openAIPaste = function() {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal">
                <span class="close" onclick="this.parentElement.parentElement.remove()">&times;</span>
                <h3>🤖 Вставь ответ ИИ</h3>
                <textarea id="aiResponse" rows="6" placeholder="Вставьте текст..."></textarea>
                <button class="btn btn-block" onclick="parseAIResponse()">Распарсить</button>
            </div>
        `;
        document.body.appendChild(modal);
    };
    window.parseAIResponse = function() {
        const text = document.getElementById('aiResponse').value;
        if (!text.trim()) return toast('Вставьте текст');
        let goal = '';
        const goalMatch = text.match(/(?:Цель|Моя цель)[:\s]*(.+?)(?:\n|$)/i);
        if (goalMatch) goal = goalMatch[1].trim();
        const dirs = [];
        const dirRegex = /(?:^|\n)\s*(\d+)\.\s*([^\n]+)/g;
        let match;
        while ((match = dirRegex.exec(text)) !== null) {
            const num = parseInt(match[1]);
            const name = match[2].trim();
            const start = match.index + match[0].length;
            let end = text.indexOf(`\n${num+1}.`, start);
            if (end === -1) end = text.length;
            const block = text.substring(start, end).trim();
            const actions = [];
            block.split('\n').filter(l => l.trim().length > 0).forEach(line => {
                let freq = 'daily';
                const lower = line.toLowerCase();
                if (lower.includes('раз в неделю') || lower.includes('еженедельно') || lower.includes('р/нед')) freq = 'weekly';
                else if (lower.includes('раз в месяц') || lower.includes('ежемесячно') || lower.includes('р/мес')) freq = 'monthly';
                else if (lower.includes('раз в 3 месяца') || lower.includes('квартал')) freq = 'quarterly';
                let clean = line.replace(/^[\s\-•\d.]+/, '').trim();
                if (clean.length > 3) actions.push({ id: uid(), text: clean, freq });
            });
            dirs.push({ name, actions });
        }
        if (!goal) {
            const firstLine = text.split('\n').find(l => l.trim().length > 10);
            if (firstLine) goal = firstLine.trim();
        }
        document.getElementById('goal').value = goal;
        const dirInputs = document.querySelectorAll('.dir-name');
        dirInputs.forEach((input, i) => {
            if (i < dirs.length) {
                input.value = dirs[i].name;
                if (!state.harada) state.harada = { goal, directions: Array.from({length:8}, () => ({ name: '', actions: [] })) };
                if (!state.harada.directions[i]) state.harada.directions[i] = { name: dirs[i].name, actions: [] };
                state.harada.directions[i].actions = dirs[i].actions;
                state.harada.directions[i].name = dirs[i].name;
            }
        });
        if (!state.harada) state.harada = { goal, directions: Array.from({length:8}, () => ({ name: '', actions: [] })) };
        while (state.harada.directions.length < 8) state.harada.directions.push({ name: '', actions: [] });
        dirs.forEach((d, i) => {
            if (i < state.harada.directions.length) {
                state.harada.directions[i].name = d.name;
                state.harada.directions[i].actions = d.actions;
            }
        });
        state.harada.goal = goal;
        save(state);
        document.querySelector('.modal-overlay').remove();
        toast('Данные вставлены! Проверь и сохрани.');
        render();
    };

    // ============================================================
    // ШАГ 2
    // ============================================================
    function renderStep2(container) {
        const h = state.harada;
        if (!h) { state.currentStep = 1; render(); return; }
        const selected = state.selectedDirections.length ? state.selectedDirections : h.directions.map((_,i)=>i);
        let html = `
            <div class="card">
                <h2>🧭 Шаг 2. Выбери фокус на этот месяц</h2>
                <input type="range" id="energySlider" min="0" max="100" value="70" style="width:100%;" oninput="updateEnergy()" />
                <div style="display:flex; justify-content:space-between;">
                    <span>0%</span>
                    <span id="energyLabel">70%</span>
                    <span>100%</span>
                </div>
                <p>Рекомендуем <strong id="recommendCount">4</strong> направления</p>
                <div class="grid">
                    <div><strong>Направления</strong></div>
                    <div><strong>Выбрать</strong></div>
        `;
        h.directions.forEach((d, i) => {
            const checked = selected.includes(i) ? 'checked' : '';
            html += `
                <div>${d.name || 'Направление '+(i+1)}</div>
                <div><input type="checkbox" class="dir-check" data-idx="${i}" ${checked} /></div>
            `;
        });
        html += `
                </div>
                <button class="btn btn-block" onclick="saveDirections()">Сохранить выбор →</button>
            </div>
        `;
        container.innerHTML = html;
        setTimeout(updateEnergy, 50);
    }

    function getDirCountByEnergy(energy) {
        if (energy >= 80) return 6;
        if (energy >= 50) return 4;
        if (energy >= 25) return 2;
        return 1;
    }
    window.updateEnergy = function() {
        const slider = document.getElementById('energySlider');
        if (!slider) return;
        const energy = parseInt(slider.value);
        document.getElementById('energyLabel').textContent = energy + '%';
        const count = getDirCountByEnergy(energy);
        document.getElementById('recommendCount').textContent = count;
        const checks = document.querySelectorAll('.dir-check');
        checks.forEach((cb, idx) => { cb.checked = (idx < count); });
    };
    window.saveDirections = function() {
        const checks = document.querySelectorAll('.dir-check:checked');
        const selected = [];
        checks.forEach(cb => selected.push(parseInt(cb.dataset.idx)));
        if (selected.length === 0) return toast('Выберите хотя бы одно направление');
        state.selectedDirections = selected;
        save(state);
        toast('Выбор сохранён!');
        state.currentStep = 3;
        render();
    };

    // ============================================================
    // ШАГ 3 (пошаговый выбор + календарь для любой weekly)
    // ============================================================
    function renderStep3(container) {
        const h = state.harada;
        if (!h) { state.currentStep = 1; render(); return; }
        const selectedDirs = state.selectedDirections.length ? state.selectedDirections : h.directions.map((_,i)=>i);
        let allActions = [];
        let longTermActions = [];
        selectedDirs.forEach(idx => {
            const dir = h.directions[idx];
            dir.actions.forEach(a => {
                const action = { ...a, dirName: dir.name, actionId: a.id || uid() };
                if (a.freq === 'monthly' || a.freq === 'quarterly') {
                    longTermActions.push(action);
                } else {
                    // Определяем weekly: если freq содержит "нед" или freq === 'weekly'
                    const isWeekly = (a.freq && a.freq.includes('нед')) || a.freq === 'weekly';
                    action._isWeekly = isWeekly;
                    allActions.push(action);
                }
            });
        });
        if (allActions.length === 0 && longTermActions.length === 0) {
            container.innerHTML = `<div class="card"><h2>📋 Шаг 3</h2><p>Нет задач.</p><button class="btn btn-block" onclick="state.currentStep=1;render();">Вернуться</button></div>`;
            return;
        }
        if (allActions.length === 0) {
            // только долгосрочные
            container.innerHTML = renderLongTermOnly(longTermActions);
            return;
        }
        if (state._taskIndex >= allActions.length) state._taskIndex = allActions.length - 1;
        if (state._taskIndex < 0) state._taskIndex = 0;
        const current = allActions[state._taskIndex];
        const isChecked = state.actionsChosen.includes(current.actionId);
        const isWeekly = current._isWeekly === true;
        const selectedDays = state.actionDays[current.actionId] || [];
        const daysLabels = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

        let daysHtml = '';
        if (isWeekly) {
            daysHtml = `
                <div style="margin-top:12px;">
                    <div style="font-weight:500; font-size:15px;">Выбери дни недели</div>
                    <div style="font-size:13px; color:#7a756f; margin-bottom:4px;">(можно выбрать несколько)</div>
                    <div class="day-selector" data-action-id="${current.actionId}">
                        ${daysLabels.map((label, idx) => {
                            const dayNum = idx+1;
                            const sel = selectedDays.includes(dayNum);
                            return `<button class="day-btn ${sel?'selected':''}" data-day="${dayNum}" onclick="toggleDay('${current.actionId}',${dayNum})">${label}</button>`;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // Долгосрочные задачи (если есть)
        let longHtml = '';
        if (longTermActions.length) {
            longHtml = `
                <div style="margin-top:20px; border-top:1px solid #d4d0c8; padding-top:12px;">
                    <div style="font-weight:600;">📅 Долгосрочные задачи (раз в месяц/квартал)</div>
                    ${longTermActions.map(a => `
                        <div style="display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid #f0ede7;">
                            <input type="checkbox" class="long-check" data-id="${a.actionId}" ${state.longTermTasks?.some(t=>t.id===a.actionId&&t.done)?'checked':''} />
                            <span>${a.text} (${a.freq})</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Свои задачи (форма добавления)
        let customHtml = `
            <div style="margin-top:20px; border-top:1px solid #d4d0c8; padding-top:12px;">
                <div style="font-weight:600;">➕ Добавить свою задачу</div>
                <div class="flex"><input id="customText" placeholder="Что сделать?" /><button class="btn btn-sm btn-gold" onclick="addCustomTask()">+</button></div>
                <div style="display:flex; gap:6px;">
                    <input type="number" id="customDay" min="1" max="31" placeholder="День" style="width:70px;" />
                    <select id="customTime"><option value="morning">Утро</option><option value="afternoon">День</option><option value="evening">Вечер</option></select>
                    <select id="customRepeat"><option value="none">Разово</option><option value="weekly">Еженедельно</option><option value="monthly">Ежемесячно</option></select>
                </div>
                <div style="margin-top:6px; font-size:13px;">Личные: ${state.customTasks?.length||0}</div>
            </div>
        `;

        let html = `
            <div class="card">
                <h2>📋 Шаг 3. Выбери задачи</h2>
                <p>Задача ${state._taskIndex+1} из ${allActions.length} (выбрано: ${state.actionsChosen.length})</p>
                <div style="display:flex; align-items:center; gap:20px; padding:20px 0; border-top:2px solid #4a7c96; border-bottom:2px solid #4a7c96; margin:16px 0;">
                    <div style="flex:1; font-size:20px; font-weight:500;">${current.text}</div>
                    <div>
                        <label style="display:block; text-align:center; font-size:14px;">Взять</label>
                        <input type="checkbox" class="action-check-single" data-id="${current.actionId}" ${isChecked?'checked':''} style="width:40px;height:40px;cursor:pointer;" />
                    </div>
                </div>
                ${daysHtml}
                <div style="display:flex; gap:10px; justify-content:space-between; margin-top:16px;">
                    <button class="btn btn-outline" onclick="prevTask()" ${state._taskIndex===0?'disabled':''}>← Назад</button>
                    <button class="btn" onclick="nextTask()">Далее →</button>
                </div>
                <button class="btn btn-gold btn-block" style="margin-top:16px;" onclick="finishStep3()">✅ Завершить выбор (${state.actionsChosen.length} задач)</button>
                ${longHtml}
                ${customHtml}
            </div>
        `;
        container.innerHTML = html;
        // Обработчик чекбокса
        document.querySelector('.action-check-single')?.addEventListener('change', function() {
            const id = this.dataset.id;
            if (this.checked) { if (!state.actionsChosen.includes(id)) state.actionsChosen.push(id); }
            else { state.actionsChosen = state.actionsChosen.filter(item => item !== id); }
            save(state);
            render();
        });
        // Обработчики долгосрочных
        document.querySelectorAll('.long-check').forEach(el => {
            el.addEventListener('change', function() {
                const id = this.dataset.id;
                if (!state.longTermTasks) state.longTermTasks = [];
                let task = state.longTermTasks.find(t => t.id === id);
                if (!task) { task = { id, done: false }; state.longTermTasks.push(task); }
                task.done = this.checked;
                save(state);
            });
        });
    }

    function renderLongTermOnly(longTermActions) {
        let html = `<div class="card"><h2>📋 Шаг 3. Долгосрочные задачи</h2>`;
        longTermActions.forEach(a => {
            const done = state.longTermTasks?.some(t=>t.id===a.actionId&&t.done);
            html += `<div style="display:flex; gap:8px; padding:4px 0; border-bottom:1px solid #f0ede7;">
                <input type="checkbox" class="long-check" data-id="${a.actionId}" ${done?'checked':''} />
                <span>${a.text} (${a.freq})</span>
            </div>`;
        });
        html += `<button class="btn btn-block" onclick="finishStep3()">✅ Далее</button></div>`;
        return html;
    }

    window.toggleDay = function(actionId, dayNum) {
        if (!state.actionDays[actionId]) state.actionDays[actionId] = [];
        const days = state.actionDays[actionId];
        const idx = days.indexOf(dayNum);
        if (idx > -1) days.splice(idx, 1);
        else days.push(dayNum);
        days.sort((a,b)=>a-b);
        save(state);
        const container = document.querySelector(`.day-selector[data-action-id="${actionId}"]`);
        if (container) {
            container.querySelectorAll('.day-btn').forEach(btn => {
                const day = parseInt(btn.dataset.day);
                btn.classList.toggle('selected', days.includes(day));
            });
        }
    };

    window.prevTask = function() {
        if (state._taskIndex > 0) { state._taskIndex--; render(); }
    };
    window.nextTask = function() {
        const h = state.harada;
        if (!h) return;
        const selectedDirs = state.selectedDirections.length ? state.selectedDirections : h.directions.map((_,i)=>i);
        let allActions = [];
        selectedDirs.forEach(idx => {
            const dir = h.directions[idx];
            dir.actions.forEach(a => {
                if (a.freq === 'monthly' || a.freq === 'quarterly') return;
                allActions.push({ ...a, dirName: dir.name, actionId: a.id || uid() });
            });
        });
        if (state._taskIndex < allActions.length - 1) {
            state._taskIndex++;
            render();
        } else {
            toast('Все задачи просмотрены');
        }
    };

    window.addCustomTask = function() {
        const text = document.getElementById('customText').value.trim();
        if (!text) return toast('Введите название');
        const day = parseInt(document.getElementById('customDay').value) || null;
        const time = document.getElementById('customTime').value || 'morning';
        const repeat = document.getElementById('customRepeat').value || 'none';
        if (!state.customTasks) state.customTasks = [];
        state.customTasks.push({ id: uid(), text, date: day, timeSlot: time, repeat, done: false });
        save(state);
        toast('Задача добавлена');
        render();
    };

    window.finishStep3 = function() {
        // Сохраняем выбор
        const cb = document.querySelector('.action-check-single');
        if (cb) {
            const id = cb.dataset.id;
            if (cb.checked && !state.actionsChosen.includes(id)) state.actionsChosen.push(id);
            else if (!cb.checked && state.actionsChosen.includes(id)) state.actionsChosen = state.actionsChosen.filter(item => item !== id);
            save(state);
        }
        toast(`Выбрано ${state.actionsChosen.length} задач`);
        state.currentStep = 3.5;
        render();
    };

    // ============================================================
    // ШАГ 3.5 (неделя + матрица с выбором времени)
    // ============================================================
    function renderStep35(container) {
        const h = state.harada;
        if (!h) { state.currentStep = 1; render(); return; }
        const selectedDirs = state.selectedDirections.length ? state.selectedDirections : h.directions.map((_,i)=>i);
        let allActions = [];
        selectedDirs.forEach(idx => {
            const dir = h.directions[idx];
            dir.actions.forEach(a => {
                if (state.actionsChosen.includes(a.id || a.text) && a.freq !== 'monthly' && a.freq !== 'quarterly') {
                    allActions.push({ ...a, actionId: a.id || a.text });
                }
            });
        });
        // Подгружаем custom
        const customSelected = state.customTasks?.filter(t => !t.done) || [];

        // Инициализируем weekPlan, если пустой
        if (!state.weekPlan || Object.keys(state.weekPlan).length === 0) {
            const days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
            state.weekPlan = {};
            days.forEach(d => { state.weekPlan[d] = { morning: [], afternoon: [], evening: [] }; });
            save(state);
        }

        const dayKeys = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
        const dayLabels = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
        const slots = ['morning', 'afternoon', 'evening'];
        const slotLabels = { morning: 'Утро', afternoon: 'День', evening: 'Вечер' };

        // Построить карту
        const daysMap = {};
        dayKeys.forEach(key => {
            daysMap[key] = { morning: [], afternoon: [], evening: [] };
            const plan = state.weekPlan[key] || { morning: [], afternoon: [], evening: [] };
            Object.keys(plan).forEach(slot => {
                const ids = plan[slot] || [];
                ids.forEach(id => {
                    const found = allActions.find(a => a.actionId === id) || customSelected.find(t => t.id === id);
                    if (found) daysMap[key][slot].push(found);
                });
            });
        });

        // Задачи без дня и времени
        const assigned = new Set();
        dayKeys.forEach(key => {
            const plan = state.weekPlan[key] || { morning: [], afternoon: [], evening: [] };
            Object.values(plan).forEach(arr => arr.forEach(id => assigned.add(id)));
        });
        const noDayTasks = [...allActions, ...customSelected].filter(t => !assigned.has(t.id || t.actionId));

        // Строим сетку недели
        let weekHtml = `<div class="week-grid">`;
        dayKeys.forEach((key, idx) => {
            const slotsData = daysMap[key];
            weekHtml += `<div class="week-cell"><div class="day-label">${dayLabels[idx]}</div>`;
            slots.forEach(slot => {
                const tasks = slotsData[slot] || [];
                if (tasks.length === 0) {
                    weekHtml += `<div class="slot-label">${slotLabels[slot]}: —</div>`;
                } else {
                    weekHtml += `<div class="slot-label">${slotLabels[slot]}:</div>`;
                    tasks.forEach(t => {
                        weekHtml += `<div class="task-item">${t.text} <span class="del" onclick="removeFromDay('${t.id || t.actionId}','${key}','${slot}')">✕</span></div>`;
                    });
                }
            });
            weekHtml += `</div>`;
        });
        weekHtml += `</div>`;

        // Блок задач без дня
        let noDayHtml = '';
        if (noDayTasks.length > 0) {
            noDayHtml = `
                <div style="margin-top:16px; border-top:1px solid #d4d0c8; padding-top:12px;">
                    <div style="font-weight:600;">⚠️ Задачи без дня (${noDayTasks.length})</div>
                    ${noDayTasks.map(t => `
                        <div style="display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px solid #f0ede7;">
                            <span>${t.text}</span>
                            <select onchange="assignTask('${t.id || t.actionId}', this.value, document.getElementById('slot_${t.id || t.actionId}').value)">
                                <option value="">День</option>
                                ${dayKeys.map((dk, i) => `<option value="${dk}">${dayLabels[i]}</option>`).join('')}
                            </select>
                            <select id="slot_${t.id || t.actionId}" onchange="updateSlotPreview(this)">
                                <option value="morning">Утро</option>
                                <option value="afternoon">День</option>
                                <option value="evening">Вечер</option>
                            </select>
                            <button class="btn btn-sm btn-rose" onclick="sendToMatrix('${t.id || t.actionId}')">📊 В матрицу</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        let html = `
            <div class="card">
                <h2>📅 Твоя неделя</h2>
                <p>Задачи распределены по дням и времени. Ты можешь редактировать.</p>
                ${weekHtml}
                ${noDayHtml}
                <div style="margin-top:16px;">
                    <button class="btn btn-gold" onclick="openMatrixModal()">❓ Матрица Эйзенхауэра</button>
                </div>
                <button class="btn btn-block" style="margin-top:16px;" onclick="saveWeekPlan()">✅ Сохранить план на неделю</button>
            </div>
        `;
        container.innerHTML = html;
    }

    // ===== ФУНКЦИИ ДЛЯ ШАГА 3.5 =====
    window.assignTask = function(actionId, dayKey, slot) {
        if (!dayKey || !slot) return toast('Выберите день и время');
        if (!state.weekPlan) {
            const days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
            state.weekPlan = {};
            days.forEach(d => { state.weekPlan[d] = { morning: [], afternoon: [], evening: [] }; });
        }
        if (!state.weekPlan[dayKey]) state.weekPlan[dayKey] = { morning: [], afternoon: [], evening: [] };
        // Удаляем из всех других слотов
        Object.keys(state.weekPlan).forEach(k => {
            Object.keys(state.weekPlan[k]).forEach(s => {
                state.weekPlan[k][s] = state.weekPlan[k][s].filter(id => id !== actionId);
            });
        });
        state.weekPlan[dayKey][slot].push(actionId);
        save(state);
        toast(`Задача добавлена в ${dayKey}, ${slot}`);
        render();
    };

    window.removeFromDay = function(actionId, dayKey, slot) {
        if (state.weekPlan && state.weekPlan[dayKey] && state.weekPlan[dayKey][slot]) {
            state.weekPlan[dayKey][slot] = state.weekPlan[dayKey][slot].filter(id => id !== actionId);
            save(state);
            render();
        }
    };

    window.sendToMatrix = function(actionId) {
        const h = state.harada;
        if (!h) return;
        let task = null;
        for (let dir of h.directions) {
            for (let a of dir.actions) {
                if ((a.id || a.text) === actionId) {
                    task = { id: actionId, text: a.text, quadrant: 'plan' };
                    break;
                }
            }
            if (task) break;
        }
        if (!task) {
            const custom = state.customTasks?.find(t => t.id === actionId);
            if (custom) task = { id: actionId, text: custom.text, quadrant: 'plan' };
        }
        if (!task) { toast('Задача не найдена'); return; }
        if (!state.matrixTasks) state.matrixTasks = [];
        if (!state.matrixTasks.find(t => t.id === actionId)) state.matrixTasks.push(task);
        // Удаляем из недели
        if (state.weekPlan) {
            Object.keys(state.weekPlan).forEach(k => {
                Object.keys(state.weekPlan[k]).forEach(s => {
                    state.weekPlan[k][s] = state.weekPlan[k][s].filter(id => id !== actionId);
                });
            });
        }
        save(state);
        toast('Задача отправлена в матрицу');
        render();
    };

    window.openMatrixModal = function() {
        const tasks = state.matrixTasks || [];
        if (tasks.length === 0) { toast('В матрице пока нет задач'); return; }
        const quadrants = {
            now: { label: '🔥 Сделать сейчас', color: '#d4edda' },
            plan: { label: '📅 Запланировать', color: '#fff3cd' },
            minute: { label: '⚡ Задания на минуту', color: '#f8d7da' },
            joy: { label: '🎁 Для себя и радости', color: '#e2e3e5' }
        };
        let html = `<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">`;
        Object.keys(quadrants).forEach(key => {
            const q = quadrants[key];
            const items = tasks.filter(t => t.quadrant === key);
            html += `
                <div style="background:${q.color}; border-radius:8px; padding:10px; min-height:80px;">
                    <div style="font-weight:600; font-size:14px;">${q.label}</div>
                    ${items.map(t => `
                        <div class="matrix-task">
                            <span>${t.text}</span>
                            <div class="actions">
                                <button onclick="moveTaskFromMatrix('${t.id}')">↩️</button>
                                <button onclick="markMatrixDone('${t.id}')">✅</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        });
        html += `</div>`;
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal">
                <span class="close" onclick="this.parentElement.parentElement.remove()">&times;</span>
                <h3>📊 Матрица Эйзенхауэра</h3>
                ${html}
            </div>
        `;
        document.body.appendChild(modal);
    };

    window.moveTaskFromMatrix = function(id) {
        const idx = state.matrixTasks.findIndex(t => t.id === id);
        if (idx > -1) {
            const task = state.matrixTasks[idx];
            state.matrixTasks.splice(idx, 1);
            if (!state.customTasks) state.customTasks = [];
            state.customTasks.push({ id: task.id, text: task.text, date: null, timeSlot: 'morning', repeat: 'none', done: false });
            save(state);
            toast('Задача возвращена в список');
            document.querySelector('.modal-overlay')?.remove();
            render();
        }
    };

    window.markMatrixDone = function(id) {
        const idx = state.matrixTasks.findIndex(t => t.id === id);
        if (idx > -1) {
            state.matrixTasks.splice(idx, 1);
            save(state);
            toast('✅ Задача выполнена!');
            document.querySelector('.modal-overlay')?.remove();
            render();
        }
    };

    window.saveWeekPlan = function() {
        toast('План сохранён! Переход к календарю...');
        // Здесь будет переход на шаг 4 (календарь)
        state.currentStep = 4;
        render();
    };

    // ===== ЗАПУСК =====
    if (!state.harada) state.currentStep = 1;
    else if (state.selectedDirections.length === 0) state.currentStep = 2;
    else if (state.currentStep === 3.5 || state.currentStep === 4) state.currentStep = 3.5;
    else state.currentStep = 3;
    render();
</script>
</body>
</html>
