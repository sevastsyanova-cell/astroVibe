<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Тест: квадрат + выбор задач</title>
    <style>
        /* (стили те же, что были) */
        :root {
            --bg: #f9f7f3;
            --white: #ffffff;
            --card-shadow: 0 8px 24px rgba(0,0,0,0.06);
            --radius: 18px;
            --radius-sm: 10px;
            --blue: #4a7c96;
            --gold: #c4946c;
            --rose: #e8c4b8;
            --green: #7baa7b;
            --gray: #d4d0c8;
            --text: #3a3530;
            --text-light: #7a756f;
            --font: 'Segoe UI', -apple-system, Roboto, 'Helvetica Neue', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #app {
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
        }
        .card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--card-shadow);
            padding: 24px 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text);
        }
        .card-sub {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 28px;
            font-size: 16px;
            font-weight: 500;
            background: var(--blue);
            color: white;
            cursor: pointer;
            transition: 0.2s ease;
            text-align: center;
            min-height: 48px;
            touch-action: manipulation;
            text-decoration: none;
            line-height: 1.2;
        }
        .btn:hover { opacity: 0.85; }
        .btn:active { transform: scale(0.97); }
        .btn-gold { background: var(--gold); }
        .btn-rose { background: var(--rose); color: var(--text); }
        .btn-outline { background: transparent; border: 2px solid var(--blue); color: var(--blue); }
        .btn-sm { padding: 8px 16px; font-size: 14px; min-height: 40px; }
        .btn-block { display: block; width: 100%; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
        .btn-group .btn { flex: 1 1 auto; }
        input, textarea, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8e4dc;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: var(--font);
            background: white;
            transition: 0.2s ease;
            color: var(--text);
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(74,124,150,0.15);
        }
        label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 14px; }
        .field-group { margin-bottom: 18px; }
        .chip {
            display: inline-block;
            background: var(--bg);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            margin: 3px 4px 3px 0;
        }
        .accordion {
            border: 1px solid #e8e4dc;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            overflow: hidden;
        }
        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            background: var(--bg);
            transition: 0.2s ease;
            font-weight: 500;
            font-size: 15px;
        }
        .accordion-header:hover { background: #e8e4dc; }
        .accordion-body { padding: 0 16px 12px; display: none; }
        .accordion-body.open { display: block; }
        .task-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #f0ede7;
        }
        .task-row .check { width: 22px; height: 22px; cursor: pointer; flex-shrink: 0; }
        .task-row .text { flex: 1; min-width: 0; }
        .task-row .text .freq { font-size: 12px; color: var(--text-light); }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--text);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 2000;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .info-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e8e4dc;
            font-size: 14px;
            color: var(--text-light);
            text-align: center;
        }
        .hidden { display: none; }
        .mt-16 { margin-top: 16px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        /* Модальное окно (простое) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal {
            background: white;
            border-radius: var(--radius);
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        .modal-overlay.open .modal { transform: scale(1); }
        .modal .close {
            float: right;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            padding: 0 4px;
        }
        .modal .close:hover { color: var(--text); }
    </style>
</head>
<body>
<div id="app">
    <div id="screen-container"></div>
    <div class="toast" id="toast"></div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <button class="close" id="modalClose">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 1. ХРАНИЛИЩЕ (тестовый ключ)
    // ============================================================
    const TEST_STORAGE_KEY = 'harada_test_v1';

    function loadData() {
        try { const raw = localStorage.getItem(TEST_STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
    }
    function saveData(data) {
        localStorage.setItem(TEST_STORAGE_KEY, JSON.stringify(data));
    }

    let state = loadData() || {
        harada: null,
        selectedDirections: [],
        actionsChosen: [],
        customTasks: [],
        currentStep: 1,
        maxTasksPerDay: 5
    };

    // ============================================================
    // 2. ВСПОМОГАТЕЛЬНЫЕ
    // ============================================================
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove('show'), 2800);
    }
    function modalOpen(html) {
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('modalOverlay').classList.add('open');
    }
    function modalClose() {
        document.getElementById('modalOverlay').classList.remove('open');
    }
    document.getElementById('modalClose').addEventListener('click', modalClose);
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) modalClose();
    });

    function render(screen) {
        const container = document.getElementById('screen-container');
        const html = screens[screen]();
        container.innerHTML = html;
        if (screen === 'step1') {
            const h = state.harada;
            if (h) {
                document.getElementById('haradaGoal').value = h.goal || '';
                document.querySelectorAll('.dir-name').forEach((el, i) => {
                    if (h.directions && h.directions[i]) el.value = h.directions[i].name || '';
                });
                rebuildChips();
            }
        }
        if (screen === 'step2') setTimeout(() => updateDirections(), 50);
        if (screen === 'step3') renderTasks();
    }

    // ============================================================
    // 3. ЭКРАНЫ
    // ============================================================
    const screens = {};

    // ----- ШАГ 1: СОЗДАНИЕ КВАДРАТА (с кнопками ИИ) -----
    screens.step1 = () => {
        const h = state.harada || { goal: '', directions: Array.from({length:8}, () => ({ name: '', actions: [] })) };
        let html = `
            <div class="card">
                <div class="card-title">🎯 Шаг 1. Твой квадрат Харада</div>
                <div class="card-sub">Цель на 12 месяцев, 8 направлений, действия с частотой. Можно заполнить вручную или вставить из ИИ.</div>
                <div style="display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
                    <button class="btn btn-sm btn-gold" onclick="openPromptModal()">📄 Промпт для ИИ</button>
                    <button class="btn btn-sm" onclick="openAIPaste()">🤖 Вставить из ИИ</button>
                </div>
                <div class="field-group">
                    <label>Моя цель (одной фразой, как уже сбылась)</label>
                    <input id="haradaGoal" placeholder="Например: Я веду блог на 10 000 подписчиков и получаю 5 клиентов в месяц" />
                </div>
                <div style="margin-bottom:12px;"><strong>8 направлений</strong></div>
        `;
        for (let i=0; i<8; i++) {
            const dir = h.directions[i] || { name: '', actions: [] };
            html += `
                <div class="field-group" style="margin-bottom:12px;">
                    <label>Направление ${i+1}</label>
                    <input class="dir-name" data-idx="${i}" placeholder="Например: Привлечение клиентов" />
                    <div style="margin-top:6px; display:flex; flex-wrap:wrap; gap:4px;">
                        ${dir.actions.map((a, ai) => `
                            <span class="chip" style="background:#e8e4dc; display:inline-flex; align-items:center; gap:4px;">
                                ${a.text} (${a.freq})
                                <span style="cursor:pointer; color:var(--text-light);" onclick="removeAction(${i},${ai})">&times;</span>
                            </span>
                        `).join('')}
                    </div>
                    <div style="display:flex; gap:8px; margin-top:4px; flex-wrap:wrap;">
                        <input class="act-text" data-idx="${i}" placeholder="Действие (напр. пост в ТГ)" style="flex:2; min-width:120px;" />
                        <select class="act-freq" data-idx="${i}" style="flex:1; min-width:80px;">
                            <option value="daily">ежедневно</option>
                            <option value="weekly">раз в неделю</option>
                            <option value="monthly">раз в месяц</option>
                            <option value="quarterly">раз в 3 мес</option>
                        </select>
                        <button class="btn btn-sm btn-gold" onclick="addAction(${i})">+</button>
                    </div>
                </div>
            `;
        }
        html += `
                <button class="btn btn-block" onclick="saveHarada()">Сохранить квадрат →</button>
            </div>
        `;
        return html;
    };

    // ----- ШАГ 2: ВЫБОР НАПРАВЛЕНИЙ -----
    screens.step2 = () => {
        const h = state.harada;
        if (!h) return '<div class="card">Нет квадрата. <button class="btn" onclick="render(\'step1\')">Вернуться</button></div>';
        const selected = state.selectedDirections.length ? state.selectedDirections : h.directions.map((_,i)=>i);
        let html = `
            <div class="card">
                <div class="card-title">🧭 Шаг 2. Выбери фокус на этот месяц</div>
                <div class="card-sub">Оцени свой уровень энергии. Система предложит оптимальное количество направлений.</div>
                <div class="field-group">
                    <label>Моя энергия сейчас (0–100%)</label>
                    <input type="range" id="energySlider" min="0" max="100" value="70" style="width:100%;" oninput="updateDirections()" />
                    <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--text-light);">
                        <span>0%</span>
                        <span id="energyLabel">70%</span>
                        <span>100%</span>
                    </div>
                    <div style="text-align:center; margin-top:4px; font-size:14px; color:var(--blue);">
                        Рекомендуем <strong id="recommendCount">4</strong> направления
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:1fr auto; gap:16px; align-items:start; margin-top:8px;">
                    <div style="font-weight:600; font-size:14px; color:var(--text-light);">Направления</div>
                    <div style="font-weight:600; font-size:14px; color:var(--text-light);">Выбрать</div>
        `;
        h.directions.forEach((d, i) => {
            const checked = selected.includes(i) ? 'checked' : '';
            html += `
                <div style="padding:6px 0; border-bottom:1px solid #f0ede7; display:contents;">
                    <div style="padding:6px 0;">${d.name || 'Направление '+(i+1)}</div>
                    <div style="padding:6px 0; text-align:center;">
                        <input type="checkbox" class="dir-check" data-idx="${i}" ${checked} onchange="onDirCheckChange()" />
                    </div>
                </div>
            `;
        });
        html += `
                </div>
                <button class="btn btn-block" style="margin-top:20px;" onclick="saveDirections()">Сохранить выбор →</button>
            </div>
        `;
        return html;
    };

    // ----- ШАГ 3: ВЫБОР ДЕЙСТВИЙ + РУЧНОЙ ВВОД -----
    screens.step3 = () => {
        const h = state.harada;
        if (!h) return '<div class="card">Нет данных. <button class="btn" onclick="render(\'step1\')">Начать сначала</button></div>';
        const selectedDirs = state.selectedDirections.length ? state.selectedDirections : h.directions.map((_,i)=>i);
        let allActions = [];
        selectedDirs.forEach(idx => {
            const dir = h.directions[idx];
            dir.actions.forEach(a => {
                if (a.freq === 'monthly' || a.freq === 'quarterly') return;
                allActions.push({ ...a, dirName: dir.name, actionId: a.id || uid() });
            });
        });
        const chosenIds = state.actionsChosen || [];

        let html = `
            <div class="card">
                <div class="card-title">📋 Шаг 3. Выбери задачи на эту неделю</div>
                <div class="card-sub">Отметь галочками задачи, которые будешь делать. Добавь свои, если нужно.</div>
                <div class="field-group">
                    <label>Максимум задач в день</label>
                    <input type="range" id="maxTasksSlider" min="3" max="10" step="1" value="${state.maxTasksPerDay || 5}" style="width:100%;" oninput="document.getElementById('maxTasksLabel').textContent=this.value" />
                    <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--text-light);">
                        <span>3</span>
                        <span id="maxTasksLabel">${state.maxTasksPerDay || 5}</span>
                        <span>10</span>
                    </div>
                </div>
                <div id="taskList">
        `;
        const grouped = {};
        allActions.forEach(a => {
            if (!grouped[a.dirName]) grouped[a.dirName] = [];
            grouped[a.dirName].push(a);
        });
        const dirNames = Object.keys(grouped);
        dirNames.forEach((dirName, idx) => {
            const actions = grouped[dirName];
            const selectedCount = actions.filter(a => chosenIds.includes(a.actionId)).length;
            const isOpen = (idx === 0);
            html += `
                <div class="accordion">
                    <div class="accordion-header" onclick="toggleAccordion(this)">
                        <span>${dirName}</span>
                        <span>${selectedCount}/${actions.length} выбрано <span>${isOpen ? '▾' : '▸'}</span></span>
                    </div>
                    <div class="accordion-body ${isOpen ? 'open' : ''}">
            `;
            actions.forEach(a => {
                const checked = chosenIds.includes(a.actionId) ? 'checked' : '';
                html += `
                    <div class="task-row">
                        <input type="checkbox" class="action-check" data-id="${a.actionId}" ${checked} />
                        <div class="text">
                            ${a.text}
                            <div class="freq">${a.freq || ''}</div>
                        </div>
                    </div>
                `;
            });
            html += `
                    </div>
                </div>
            `;
        });

        html += `
                </div>
                <div style="margin-top:16px; border-top:1px solid #e8e4dc; padding-top:16px;">
                    <div class="card-title" style="font-size:17px;">➕ Добавить свою задачу</div>
                    <div class="field-group">
                        <input id="customTaskText" placeholder="Что нужно сделать?" />
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <div>
                            <label>Дата (день месяца)</label>
                            <input type="number" id="customTaskDay" min="1" max="31" placeholder="15" />
                        </div>
                        <div>
                            <label>Время суток</label>
                            <select id="customTaskTime">
                                <option value="morning">Утро</option>
                                <option value="afternoon">День</option>
                                <option value="evening">Вечер</option>
                            </select>
                        </div>
                    </div>
                    <div class="field-group">
                        <label>Повторять</label>
                        <select id="customTaskRepeat">
                            <option value="none">Никогда</option>
                            <option value="weekly">Каждую неделю</option>
                            <option value="monthly">Каждый месяц</option>
                            <option value="yearly">Каждый год</option>
                        </select>
                    </div>
                    <button class="btn btn-gold btn-block" onclick="addCustomTask()">➕ Добавить задачу</button>
                </div>
                <div style="margin-top:16px;">
                    <strong>Мои личные задачи:</strong>
                    <div id="customTaskList"></div>
                </div>
                <button class="btn btn-block mt-16" onclick="finishStep3()">✅ Перейти к планировщику →</button>
            </div>
        `;
        return html;
    };

    // ============================================================
    // 4. ФУНКЦИИ УПРАВЛЕНИЯ
    // ============================================================

    // ----- ШАГ 1 (ручное добавление) -----
    window.addAction = function(dirIdx) {
        const container = document.querySelector(`.act-text[data-idx="${dirIdx}"]`);
        const freqSelect = document.querySelector(`.act-freq[data-idx="${dirIdx}"]`);
        if (!container) return;
        const text = container.value.trim();
        const freq = freqSelect ? freqSelect.value : 'daily';
        if (!text) { toast('Введите текст действия'); return; }
        if (!state.harada) state.harada = { goal: '', directions: Array.from({length:8}, () => ({ name: '', actions: [] })) };
        if (!state.harada.directions[dirIdx]) state.harada.directions[dirIdx] = { name: '', actions: [] };
        state.harada.directions[dirIdx].actions.push({ id: uid(), text, freq });
        saveData(state);
        container.value = '';
        if (freqSelect) freqSelect.value = 'daily';
        render('step1');
        toast('Действие добавлено');
    };

    window.removeAction = function(dirIdx, actIdx) {
        if (!state.harada) return;
        state.harada.directions[dirIdx].actions.splice(actIdx, 1);
        saveData(state);
        render('step1');
    };

    window.saveHarada = function() {
        const goal = document.getElementById('haradaGoal')?.value.trim();
        if (!goal) { toast('Введите цель'); return; }
        const dirNames = document.querySelectorAll('.dir-name');
        const h = { goal, directions: [] };
        let valid = true;
        dirNames.forEach((el, i) => {
            const name = el.value.trim() || `Направление ${i+1}`;
            const dir = state.harada?.directions?.[i] || { actions: [] };
            h.directions.push({ name, actions: dir.actions || [] });
        });
        h.directions.forEach((d, i) => {
            if (d.actions.length === 0) {
                toast(`В направлении "${d.name || i+1}" нет действий. Добавьте хотя бы одно.`);
                valid = false;
            }
        });
        if (!valid) return;
        state.harada = h;
        saveData(state);
        toast('Квадрат сохранён!');
        render('step2');
    };

    function rebuildChips() { /* чипы обновляются через add/remove */ }

    // ----- ШАГ 2 -----
    function getDirCountByEnergy(energy) {
        if (energy >= 80) return 6;
        if (energy >= 50) return 4;
        if (energy >= 25) return 2;
        return 1;
    }
    window.updateDirections = function() {
        const slider = document.getElementById('energySlider');
        if (!slider) return;
        const energy = parseInt(slider.value);
        document.getElementById('energyLabel').textContent = energy + '%';
        const count = getDirCountByEnergy(energy);
        document.getElementById('recommendCount').textContent = count;
        const checks = document.querySelectorAll('.dir-check');
        checks.forEach((cb, idx) => { cb.checked = (idx < count); });
    };
    window.onDirCheckChange = function() {};

    window.saveDirections = function() {
        const checkboxes = document.querySelectorAll('.dir-check');
        const selected = [];
        checkboxes.forEach(cb => {
            if (cb.checked) selected.push(parseInt(cb.dataset.idx));
        });
        if (selected.length === 0) { toast('Выберите хотя бы одно направление'); return; }
        state.selectedDirections = selected;
        saveData(state);
        toast('Выбор сохранён!');
        render('step3');
    };

    // ----- ШАГ 3 -----
    window.toggleAccordion = function(header) {
        const body = header.nextElementSibling;
        if (body) {
            body.classList.toggle('open');
            const icon = header.querySelector('span:last-child');
            if (icon) icon.textContent = body.classList.contains('open') ? '▾' : '▸';
        }
    };

    function renderTasks() {
        const container = document.getElementById('customTaskList');
        if (!container) return;
        const tasks = state.customTasks || [];
        if (tasks.length === 0) {
            container.innerHTML = '<div style="color:var(--text-light); font-size:14px;">Нет личных задач.</div>';
            return;
        }
        let html = '';
        tasks.forEach((t, idx) => {
            const dateInfo = t.date ? ` (${t.date}-е число)` : '';
            const repeatInfo = t.repeat && t.repeat !== 'none' ? `, повтор: ${t.repeat}` : '';
            const timeInfo = t.timeSlot ? `, ${t.timeSlot}` : '';
            html += `
                <div class="task-row">
                    <input type="checkbox" class="custom-check" data-idx="${idx}" ${t.done ? 'checked' : ''} />
                    <div class="text">
                        ${t.text}
                        <div class="freq">${dateInfo}${repeatInfo}${timeInfo}</div>
                    </div>
                    <span style="cursor:pointer; color:var(--text-light);" onclick="removeCustomTask(${idx})">✕</span>
                </div>
            `;
        });
        container.innerHTML = html;
        document.querySelectorAll('.custom-check').forEach(el => {
            el.addEventListener('change', function() {
                const idx = parseInt(this.dataset.idx);
                if (state.customTasks && state.customTasks[idx]) {
                    state.customTasks[idx].done = this.checked;
                    saveData(state);
                }
            });
        });
    }

    window.addCustomTask = function() {
        const text = document.getElementById('customTaskText')?.value.trim();
        if (!text) { toast('Введите название задачи'); return; }
        const day = parseInt(document.getElementById('customTaskDay')?.value) || null;
        const timeSlot = document.getElementById('customTaskTime')?.value || 'morning';
        const repeat = document.getElementById('customTaskRepeat')?.value || 'none';
        if (!state.customTasks) state.customTasks = [];
        state.customTasks.push({ id: uid(), text, date: day, timeSlot, repeat, done: false });
        saveData(state);
        document.getElementById('customTaskText').value = '';
        document.getElementById('customTaskDay').value = '';
        render('step3');
        toast('Задача добавлена!');
    };

    window.removeCustomTask = function(idx) {
        if (!state.customTasks) return;
        state.customTasks.splice(idx, 1);
        saveData(state);
        render('step3');
    };

    window.finishStep3 = function() {
        const checks = document.querySelectorAll('.action-check:checked');
        const chosen = [];
        checks.forEach(cb => chosen.push(cb.dataset.id));
        state.actionsChosen = chosen;
        const slider = document.getElementById('maxTasksSlider');
        if (slider) state.maxTasksPerDay = parseInt(slider.value);
        saveData(state);
        toast(`✅ Выбрано задач: ${chosen.length}. Личных: ${state.customTasks?.length || 0} (планировщик в разработке)`);
    };

    // ============================================================
    // 5. ИНТЕГРАЦИЯ С ИИ (промпт и вставка)
    // ============================================================
    window.openPromptModal = function() {
        const promptText = `Ты коуч по методу Харада. Помоги мне собрать квадрат 9×9: в центре цель, вокруг 8 направлений, в каждом 8 регулярных действий.

Ограничения (читай первыми):
1. Ты интервьюер, а не консультант. Не предлагай продукты, форматы, стратегии, цены.
2. Не называй цифры, которые я не называл(а). Не придумывай чеков и расчётов.
3. Не подсказывай варианты ответов (без «например: ...»).
4. Всего не больше 15 вопросов. После ответов переходи к направлениям.
5. Не предлагай направления и выводы посреди интервью — только на шаге 2.
6. Не пересказывай мои ответы («фиксирую...», «итак...»). Получил ответ — задавай следующий вопрос.
7. Один короткий уточняющий вопрос на ответ, только если без него нельзя собрать квадрат.
8. Если я отвечаю «не знаю» — не отвечай за меня, просто переходи к следующему вопросу.
9. Задавай только по одному вопросу за раз. Не вываливай список.

Образ результата:
— Квадрат 9×9: цель по центру, 8 направлений вокруг, в каждом по 8 действий.
— Каждая ячейка — короткое (до 6 слов) регулярное действие с частотой или триггером.
— 2–3 направления — про опоры человека (энергия, тело, мышление, восстановление).
— Все действия — личные, не делегируемые, реалистичные для моей недели.
— Финал — чек-лист на первый месяц по неделям, с фокусом на сопротивления и малые шаги.

Важно для финальной выдачи:
После того как я утвержу квадрат, выдай его в виде нумерованного списка направлений с действиями. Каждое направление начинается с номера и точки, каждое действие – с дефиса или звёздочки. Частота должна быть указана рядом с действием (например, «ежедн», «раз/нед», «раз/мес», «раз/3мес»). Пример:
1. Привлечение
- пост ТГ ежедн
- подкаст 2р/нед
...
2. Упаковка и контент
- идея в день
...

Начинай с короткого приветствия, затем задай вводные вопросы (по одному за раз), потом переходи к интервью.`;

        modalOpen(`
            <h3 style="margin-bottom:12px;">📄 Промпт для ИИ</h3>
            <div style="background:var(--bg); border-radius:12px; padding:16px; font-size:14px; max-height:400px; overflow-y:auto; white-space:pre-wrap; font-family:monospace; line-height:1.5;">${promptText}</div>
            <button class="btn btn-block" style="margin-top:12px;" onclick="copyPrompt()">📋 Скопировать промпт</button>
        `);
    };

    window.copyPrompt = function() {
        const text = `Ты коуч по методу Харада. Помоги мне собрать квадрат 9×9... (полный текст)`;
        navigator.clipboard.writeText(text).then(() => {
            toast('Промпт скопирован!');
            modalClose();
        }).catch(() => toast('Не удалось скопировать'));
    };

    window.openAIPaste = function() {
        modalOpen(`
            <h3 style="margin-bottom:12px;">🤖 Вставь ответ ИИ</h3>
            <p style="font-size:14px; color:var(--text-light); margin-bottom:12px;">Скопируй ответ, который дал тебе ИИ после прохождения интервью по промпту. Я попытаюсь распарсить его и заполнить поля.</p>
            <div class="field-group">
                <textarea id="aiResponse" rows="8" placeholder="Вставь сюда текст ответа ИИ..."></textarea>
            </div>
            <button class="btn btn-block" onclick="parseAIResponse()">Распарсить и заполнить</button>
        `);
    };

    window.parseAIResponse = function() {
        const text = document.getElementById('aiResponse')?.value || '';
        if (!text.trim()) { toast('Вставь текст'); return; }

        let goal = '';
        const goalMatch = text.match(/(?:Цель|Моя цель|В центре цель)[:\s]*(.+?)(?:\n|$)/i);
        if (goalMatch) goal = goalMatch[1].trim();

        const dirs = [];
        const dirRegex = /(?:^|\n)\s*(\d+)\.\s*([^\n]+)/g;
        let match;
        while ((match = dirRegex.exec(text)) !== null) {
            const num = parseInt(match[1]);
            const name = match[2].trim();
            const start = match.index + match[0].length;
            let end = text.indexOf(`\n${num+1}.`, start);
            if (end === -1) end = text.length;
            const block = text.substring(start, end).trim();
            const actions = [];
            const actionLines = block.split('\n').filter(l => l.trim().length > 0);
            actionLines.forEach(line => {
                let freq = 'daily';
                if (line.match(/раз в неделю|еженедельно/i)) freq = 'weekly';
                else if (line.match(/раз в месяц|ежемесячно/i)) freq = 'monthly';
                else if (line.match(/раз в 3 месяца|квартал/i)) freq = 'quarterly';
                let clean = line.replace(/^[\s\-•\d.]+/, '').trim();
                if (clean.length > 3) {
                    actions.push({ id: uid(), text: clean, freq });
                }
            });
            dirs.push({ name, actions });
        }

        if (!goal) {
            const firstLine = text.split('\n').find(l => l.trim().length > 10);
            if (firstLine) goal = firstLine.trim();
        }

        // Заполняем поля
        document.getElementById('haradaGoal').value = goal;

        const dirInputs = document.querySelectorAll('.dir-name');
        dirInputs.forEach((input, i) => {
            if (i < dirs.length) {
                input.value = dirs[i].name;
                if (!state.harada) state.harada = { goal, directions: [] };
                if (!state.harada.directions[i]) state.harada.directions[i] = { name: dirs[i].name, actions: [] };
                state.harada.directions[i].actions = dirs[i].actions;
                state.harada.directions[i].name = dirs[i].name;
            } else {
                input.value = '';
            }
        });

        if (!state.harada) state.harada = { goal, directions: [] };
        while (state.harada.directions.length < 8) {
            state.harada.directions.push({ name: '', actions: [] });
        }
        dirs.forEach((d, i) => {
            if (i < state.harada.directions.length) {
                state.harada.directions[i].name = d.name;
                state.harada.directions[i].actions = d.actions;
            }
        });
        state.harada.goal = goal;
        saveData(state);
        modalClose();
        render('step1');
        toast('Данные из ИИ вставлены! Проверь и сохрани.');
    };

    // ============================================================
    // 6. ЗАПУСК
    // ============================================================
    if (!state.harada) render('step1');
    else if (state.selectedDirections.length === 0) render('step2');
    else render('step3');
</script>
</body>
</html>
